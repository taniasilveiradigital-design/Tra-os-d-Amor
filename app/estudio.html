<title>Estúdio Traços D'Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Patrick+Hand&display=swap">
<style>
:root{
  --bg:#FAF7F5; --surface:#FFFFFF; --sunk:#F3EDEA; --ink:#3B2E2A; --muted:#7A6862; --line:#E6DAD4;
  --terra:#B8674C; --terra-soft:#F4DDD3; --bar:#C9785D;
  --ok:#2F7A4A; --ok-bg:#E3F2E8; --warn:#8A5A00; --warn-bg:#FFF1D6; --bad:#A33A2B; --bad-bg:#FBE3DF;
  --e-ideia:#F6EDCF; --e-ideia-ink:#6E5410;
  --e-copy:#ECE3F5; --e-copy-ink:#5B3F7A;
  --e-criativo:#DCE7F4; --e-criativo-ink:#2F4E73;
  --e-revisao:#FBE2CC; --e-revisao-ink:#8A4A12;
  --e-cliente:#F8DDE6; --e-cliente-ink:#8A2F52;
  --e-drive:#DDEFE8; --e-drive-ink:#1F6450;
  --e-aprovado:#D5EEDB; --e-aprovado-ink:#23683A;
  --e-publicado:#EAE3DF; --e-publicado-ink:#5E4A43;
  --overlay:rgba(40,28,24,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1816; --surface:#26201D; --sunk:#2F2825; --ink:#F1E8E4; --muted:#B5A49D; --line:#3D3330;
    --terra:#E3A58D; --terra-soft:#4A3129; --bar:#E0A18A;
    --ok:#8FD4A6; --ok-bg:#1F3527; --warn:#F2C77A; --warn-bg:#3A2E16; --bad:#F2A596; --bad-bg:#43241F;
    --e-ideia:#3B331C; --e-ideia-ink:#F0D98E;
    --e-copy:#352B40; --e-copy-ink:#D9C3F0;
    --e-criativo:#26344A; --e-criativo-ink:#BFD3EE;
    --e-revisao:#452F1D; --e-revisao-ink:#F6C69B;
    --e-cliente:#46273A; --e-cliente-ink:#F2B8CC;
    --e-drive:#1F3A33; --e-drive-ink:#A6E0CC;
    --e-aprovado:#1F3A27; --e-aprovado-ink:#9FDDB0;
    --e-publicado:#352D2A; --e-publicado-ink:#D5C6BF;
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1816; --surface:#26201D; --sunk:#2F2825; --ink:#F1E8E4; --muted:#B5A49D; --line:#3D3330;
  --terra:#E3A58D; --terra-soft:#4A3129; --bar:#E0A18A;
  --ok:#8FD4A6; --ok-bg:#1F3527; --warn:#F2C77A; --warn-bg:#3A2E16; --bad:#F2A596; --bad-bg:#43241F;
  --e-ideia:#3B331C; --e-ideia-ink:#F0D98E;
  --e-copy:#352B40; --e-copy-ink:#D9C3F0;
  --e-criativo:#26344A; --e-criativo-ink:#BFD3EE;
  --e-revisao:#452F1D; --e-revisao-ink:#F6C69B;
  --e-cliente:#46273A; --e-cliente-ink:#F2B8CC;
  --e-drive:#1F3A33; --e-drive-ink:#A6E0CC;
  --e-aprovado:#1F3A27; --e-aprovado-ink:#9FDDB0;
  --e-publicado:#352D2A; --e-publicado-ink:#D5C6BF;
  --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Karla,system-ui,sans-serif;padding-inline:16px;padding-block:20px 60px}
.app{max-width:1400px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--terra)}
.hand{font-family:"Patrick Hand",Karla,cursive}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:grid;gap:2px}
.brand .eyebrow{font-family:"Patrick Hand",Karla,cursive;font-size:19px;color:var(--terra)}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:0}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
button.chip{cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 13px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--terra)}
nav.tabs button.priv{color:var(--terra)}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.panel{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--terra)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
label.f{display:grid;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label.f textarea{min-height:70px;resize:vertical;line-height:1.45}
textarea.cap{font-family:"Patrick Hand",Karla,cursive!important;font-size:17px!important}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
/* etapas */
.et{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.et-ideia{background:var(--e-ideia);color:var(--e-ideia-ink)} .et-copy{background:var(--e-copy);color:var(--e-copy-ink)}
.et-criativo{background:var(--e-criativo);color:var(--e-criativo-ink)} .et-revisao{background:var(--e-revisao);color:var(--e-revisao-ink)}
.et-cliente{background:var(--e-cliente);color:var(--e-cliente-ink)} .et-drive{background:var(--e-drive);color:var(--e-drive-ink)}
.et-aprovado{background:var(--e-aprovado);color:var(--e-aprovado-ink)} .et-publicado{background:var(--e-publicado);color:var(--e-publicado-ink)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{border-radius:12px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.col.ideia{background:var(--e-ideia)} .col.copy{background:var(--e-copy)} .col.criativo{background:var(--e-criativo)} .col.revisao{background:var(--e-revisao)}
.col.cliente{background:var(--e-cliente)} .col.drive{background:var(--e-drive)} .col.aprovado{background:var(--e-aprovado)} .col.publicado{background:var(--e-publicado)}
.col.over{outline:2px dashed var(--terra);outline-offset:-4px}
.colhd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:2px 4px}
.colhd .n{font-size:12px;opacity:.75}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--terra)}
.tile[draggable="true"]{cursor:grab}
.tile .t{font-weight:700;font-size:14px}
.tile .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tile .bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.tile .bar span{display:block;height:100%;background:var(--terra)}
.wkhd{grid-column:1/-1}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px;display:grid;align-content:start;gap:4px}
.day.out{background:transparent;border-style:dashed;opacity:.55}
.day .dn{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;display:flex;justify-content:space-between}
.day .et{display:block;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;width:100%}
.wkband{grid-column:1/-1;font-size:12px;color:var(--muted);padding:6px 4px 0}
.wkband b{color:var(--terra);font-family:"Patrick Hand",Karla,cursive;font-size:16px;font-weight:400}
/* modal */
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;padding:20px 20px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.sec.story{border-left:4px solid var(--e-criativo-ink)}
.checks{display:grid;gap:4px;font-size:14px}
.checks div{display:flex;gap:8px;align-items:baseline}
.checks .y{color:var(--ok);font-weight:700} .checks .x{color:var(--muted)}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.hint{font-size:12px;color:var(--muted)}
.hint code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px}
.actions{display:grid;gap:10px;background:var(--surface);border:1px solid var(--terra);border-radius:12px;padding:14px}
.coms{display:grid;gap:10px}
.com{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.com.sys{background:transparent;border-style:dashed}
.com .who{font-weight:700;font-size:13px}
.com .when{font-size:12px;color:var(--muted);font-weight:400}
.readv{white-space:pre-line}
/* data */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td input{width:90px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px Karla,system-ui,sans-serif}
.chart .val{fill:var(--ink);font-weight:700}
.chart rect.b{fill:var(--bar)}
.chart line{stroke:var(--line)}
ul.clean,ol.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.verdict{border-radius:12px;padding:16px;display:grid;gap:6px}
.verdict.bom{background:var(--ok-bg)} .verdict.atencao{background:var(--warn-bg)} .verdict.critico{background:var(--bad-bg)}
.melhoria{border-left:4px solid var(--terra);padding:10px 12px;background:var(--surface);border-radius:0 10px 10px 0;display:grid;gap:4px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.priv-banner{background:var(--terra-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.gen{display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:600px){
  .day{min-height:56px;padding:3px}
  .day .et{font-size:0;height:8px;padding:0;border-radius:4px}
  .cal .wd{font-size:10px;padding:2px}
  .drawer{padding-inline:16px}
  .board{grid-auto-columns:minmax(230px,85%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Estúdio de conteúdos</p>
      <h1 id="clientName">Traços D'Amor</h1>
      <p class="muted small" id="clientMeta">A carregar…</p>
    </div>
    <div class="status" id="statusChips"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secções" id="tabs"></nav>
  <main id="main" class="panel"><div class="empty"><p>A ligar à base de dados…</p></div></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
const CLIENTE = "tracosdamor";
const ETAPAS = [
  ["ideia","Ideia"],["copy","Copy"],["criativo","Criativo"],["revisao","Revisão Tânia"],
  ["cliente","Aprovação cliente"],["drive","Aprovado · Drive"],["aprovado","Aprovado"],["publicado","Publicado"]
];
const ETQ = Object.fromEntries(ETAPAS);
const IDX = Object.fromEntries(ETAPAS.map(([k],i)=>[k,i]));
const FORMATOS = ["Reel","Carrossel","Estático"];
const PASTAS = [["reels","Vídeos Reels"],["capas","Capas Reels"],["storyVideo","Vídeos Story"],["storyFoto","Fotos Story"],["feedFoto","Estáticos / Carrosséis"]];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DIAS_L = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const METRICAS_SEM = [["seguidores","Seguidores"],["novosSeguidores","Novos seguidores"],["alcance","Alcance"],["visualizacoes","Visualizações"],["interacoes","Interações"],["visitasPerfil","Visitas ao perfil"],["cliquesLink","Cliques no link"],["dms","DMs de venda"],["vendasOnline","Vendas online"],["receita","Receita (€)"]];
const METRICAS_POST = [["alcance","Alcance"],["visualizacoes","Visualizações"],["gostos","Gostos"],["comentarios","Comentários"],["partilhas","Partilhas"],["guardados","Guardados"],["cliques","Cliques no link"],["respostas","Respostas / DMs"]];

let db = null, userCap = null, sample = null;
const S = { cliente:null, semanas:[], cartoes:[], comentarios:[], pessoas:[], metricas:[], relatorios:[], rascunhos:[], loaded:{}, me:{ id:null, isOwner:false }, names:{} };
const UI = { tab:"quadro", semana:"todas", mes:"2026-10", cardId:null, pend:false, editSem:null, editEst:false, editDados:null, relId:null,
  of:{ modo:"semana", semana:"", data:"", tipo:"Feed", formato:"Reel", brief:"", busy:false, out:null, err:"" } };
try { const t = localStorage.getItem("td-tab2"); if (t) UI.tab = t; } catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const dow = s => (parse(s).getDay()+6)%7;
const fmtCurto = s => { if (!s) return ""; const d = parse(s); return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`; };
const fmtDia = s => { const d = parse(s); return `${DIAS_L[dow(s)]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fmtN = v => v == null || v === "" || isNaN(v) ? "—" : Number(v).toLocaleString("pt-PT");
const fmtQuando = t => { try { const d = new Date(t); return d.toLocaleDateString("pt-PT",{day:"numeric",month:"short"}) + " " + d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } };
const todayIso = iso(new Date());
const uidShort = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const semanaDe = d => S.semanas.find(w => w.inicio <= d && d <= w.fim);
const nome = id => (id && S.names[id]) || (id === S.me.id ? "Tu" : "Alguém");
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 2800); }

/* ---------- roles ---------- */
function papel(){
  if (S.me.isOwner) return "dona";
  const p = S.pessoas.find(x => x.id === S.me.id);
  return p?.papel || "cliente";
}
const PAPEL_TXT = { dona:"Estratega", equipa:"Equipa criativa", cliente:"Cliente" };
function visivel(c){ return papel() !== "cliente" || IDX[c.etapa] >= IDX.cliente; }

/* ---------- db ---------- */
function localMerge(id, body){ const i = S.cartoes.findIndex(x => x.id === id); if (i >= 0) S.cartoes[i] = { ...S.cartoes[i], ...body }; }
async function write(path, data, merge){
  if (!db) { toast("Sem ligação à base de dados."); return false; }
  try { const r = db.doc(path); if (merge) await r.update(data); else await r.set(data); return true; }
  catch(e){ toast(e && e.code === "invalid_argument" ? "Não tens permissão para isto." : "Não gravou. Tenta outra vez."); return false; }
}
function sub(name, q){
  q.onSnapshot(snap => { S[name] = snap.docs.map(d => ({ id:d.id, ...d.data() })); S.loaded[name] = true; onData(name); },
    () => { S.loaded[name] = true; onData(name); });
}
function onData(name){
  if (name === "comentarios" || name === "pessoas") resolveNames();
  renderChrome();
  if (UI.cardId) { renderModalLive(); }
  const a = document.activeElement;
  const editing = UI.editSem || UI.editEst || UI.editDados || (a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
  if (editing) { UI.pend = true; return; }
  renderMain();
}
document.addEventListener("focusout", () => setTimeout(() => { if (UI.pend && !(UI.editSem || UI.editEst || UI.editDados) && !(document.activeElement && $("#main").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { UI.pend = false; renderMain(); } }, 50));

async function resolveNames(){
  if (!userCap) return;
  const ids = [...new Set([...S.comentarios.map(c => c.autor), ...S.pessoas.map(p => p.id), ...S.cartoes.flatMap(c => (c.historico||[]).map(h => h.por))].filter(Boolean))].filter(id => !(id in S.names));
  if (!ids.length) return;
  try { const ps = await userCap.profiles(ids); ids.forEach(id => { S.names[id] = ps[id]?.name || ""; }); renderMain(); if (UI.cardId) renderModalLive(); } catch(e){}
}

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { S.nodb = true; renderChrome(); renderMain(); return; }
  userCap = await window.claude?.use?.("user") ?? null;
  if (userCap) { const me = await userCap.me(); S.me = { id: me.id, isOwner: me.isOwner }; if (me.id && me.name) S.names[me.id] = me.name; }
  db.doc(`clientes/${CLIENTE}`).onSnapshot(s => { S.cliente = s.exists ? s.data() : null; S.loaded.cliente = true; onData("cliente"); }, () => {});
  for (const c of ["semanas","cartoes","comentarios","pessoas","metricas","relatorios"]) sub(c, db.collection(c).where("cliente","==",CLIENTE));
  if (S.me.isOwner && S.me.id) {
    sub("rascunhos", db.collection(`data/users/${S.me.id}`));
    sample = await window.claude?.use?.("sample") ?? null;
  }
  // regista esta pessoa uma vez, para a Tânia lhe poder dar um papel
  if (S.me.id && !S.me.isOwner) {
    try { const s = await db.doc(`pessoas/${S.me.id}`).get(); if (!s.exists) await db.doc(`pessoas/${S.me.id}`).set({ cliente:CLIENTE, papel:null, desde:new Date().toISOString() }); } catch(e){}
  }
  renderChrome(); renderMain();
})();

/* ---------- card helpers ---------- */
function checklist(c){
  const items = [];
  const feed = c.tipo === "Feed";
  if (feed) {
    items.push(["Copy para Design", !!(c.tema && c.comoFazer)]);
    if (c.formato === "Reel") { items.push(["Capa Canva Reels", !!c.capaCriativo], ["Capa Final (Drive)", !!c.capaDrive]); }
    items.push([c.formato === "Reel" ? "Link Canva Reels" : "Link Canva", !!c.linkCriativo], [c.formato === "Reel" ? "Link final Reels (Drive)" : "Link final (Drive)", !!c.linkDrive], ["Legenda", !!c.legenda]);
  }
  (c.stories||[]).forEach((s,i) => {
    const n = (c.stories.length > 1) ? ` ${i+1}` : "";
    items.push([`Copy para Storie${n}`, !!(s.texto || s.tema)], [`Link Canva storie${n}`, !!s.linkCriativo], [`Link Storie Final (Drive)${n}`, !!s.linkDrive]);
  });
  return items;
}
const progresso = c => { const l = checklist(c); return l.length ? l.filter(x => x[1]).length / l.length : 0; };
const faltaDrive = c => checklist(c).filter(([n,ok]) => /Drive/.test(n) && !ok).map(x => x[0]);
const faltaCriativo = c => checklist(c).filter(([n,ok]) => /Canva/.test(n) && !ok).map(x => x[0]);
const nComs = id => S.comentarios.filter(x => x.cartao === id && !x.sistema).length;
const tituloCartao = c => c.titulo || `${DIAS_L[dow(c.data)]}: ${c.tipo}`;

function tile(c, drag){
  const pr = Math.round(progresso(c)*100);
  const ch = checklist(c);
  return `<button class="tile" data-open="${esc(c.id)}" ${drag?'draggable="true"':""} data-id="${esc(c.id)}">
    <span class="meta"><span>${esc(fmtCurto(c.data))}</span>${c.tipo==="Feed"?`<span>· ${esc(c.formato||"Feed")}</span>`:`<span>· ${(c.stories||[]).length} stories</span>`}</span>
    <span class="t">${esc(tituloCartao(c))}</span>
    ${c.tema ? `<span class="small muted">${esc(c.tema)}</span>` : (c.stories?.[0]?.tema ? `<span class="small muted">${esc(c.stories[0].tema)}</span>` : "")}
    <span class="bar" aria-hidden="true"><span style="width:${pr}%"></span></span>
    <span class="meta"><span>☑ ${ch.filter(x=>x[1]).length}/${ch.length}</span>${nComs(c.id) ? `<span>💬 ${nComs(c.id)}</span>` : ""}${c.alteracoes ? `<span class="chip bad" style="padding:0 6px">alterações</span>` : ""}</span>
  </button>`;
}

/* ---------- calendário ---------- */
function renderCal(main){
  const [y,m] = UI.mes.split("-").map(Number);
  const first = `${y}-${pad(m)}-01`; const lastDay = new Date(y, m, 0).getDate();
  const start = mondayOf(first); const end = addDays(mondayOf(`${y}-${pad(m)}-${pad(lastDay)}`), 6);
  const porDia = {}; S.cartoes.filter(visivel).forEach(c => (porDia[c.data] ||= []).push(c));
  let cells = DIAS.map(d => `<div class="wd">${d}</div>`).join("");
  for (let d = start; d <= end; d = addDays(d,1)) {
    if (dow(d) === 0) { const w = S.semanas.find(s => s.inicio === d); if (w) cells += `<div class="wkband"><b>${esc(w.titulo)}</b></div>`; }
    const its = (porDia[d]||[]).sort((a,b) => (a.tipo==="Feed"?0:1)-(b.tipo==="Feed"?0:1));
    cells += `<div class="day${d.slice(0,7)!==UI.mes?" out":""}"><span class="dn"><span>${parse(d).getDate()}</span>${d===todayIso?'<span class="chip neutral" style="padding:0 6px">hoje</span>':""}</span>
      ${its.map(c => `<button class="et et-${esc(c.etapa)}" data-open="${esc(c.id)}" title="${esc(tituloCartao(c))} · ${esc(ETQ[c.etapa])}">${esc(c.tipo==="Feed"?(c.formato||"Feed"):"Stories")}</button>`).join("")}</div>`;
  }
  main.innerHTML = `
  <div class="spread">
    <div class="row"><button class="btn" data-act="mes" data-d="-1" aria-label="Mês anterior">‹</button><h2 style="min-width:170px;text-align:center">${MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)} ${y}</h2><button class="btn" data-act="mes" data-d="1" aria-label="Mês seguinte">›</button></div>
    <div class="row small">${ETAPAS.map(([k,l]) => `<span class="et et-${k}">${l}</span>`).join("")}</div>
  </div>
  <div class="cal">${cells}</div>`;
}

async function mover(c, to, extra){
  const hist = [...(c.historico||[]), { etapa:to, por:S.me.id, em:new Date().toISOString() }];
  const body = { etapa:to, historico:hist, atualizadoEm:new Date().toISOString(), ...(extra||{}) };
  if (!extra || !("alteracoes" in extra)) if (IDX[to] > IDX[c.etapa]) body.alteracoes = false;
  const ok = await write(`cartoes/${c.id}`, body, true);
  if (ok) { localMerge(c.id, body); renderMain(); renderModalLive(); await comentarioSistema(c.id, `Passou para ${ETQ[to]}.`); toast(`Passou para ${ETQ[to]}.`); }
  return ok;
}
async function comentarioSistema(cartao, texto){
  const id = `${CLIENTE}-${uidShort()}`;
  await write(`comentarios/${id}`, { cliente:CLIENTE, cartao, autor:S.me.id, texto, em:new Date().toISOString(), sistema:true });
}

  const fd = new FormData(f); const g = k => fd.has(k) ? fd.get(k) : undefined;
  const body = {};
  ["data","tipo","formato","titulo","intencao","estrategia","tema","comoFazer","inspiracao","legenda","linkCriativo","capaCriativo","linkDrive","capaDrive","linkPost"].forEach(k => { const v = g(k); if (v !== undefined) body[k] = v; });
  if (body.tipo === "Feed" && !body.formato) body.formato = c.formato || "Reel";
  if (body.tipo === "Storie") body.formato = null;
  const st = (c.stories||[]).map((s,i) => { const o = { ...s }; ["intencao","estrategia","tema","texto","comoFazer","media","linkCriativo","linkDrive"].forEach(k => { const v = g(`s${i}_${k}`); if (v !== undefined) o[k] = v; }); return o; });
  body.stories = st;
  if (fd.has("m_alcance")) { body.metricas = {}; METRICAS_POST.forEach(([k]) => { const v = g("m_"+k); body.metricas[k] = v === "" ? null : Number(v); }); }
  if (body.data) { const w = semanaDe(body.data); body.semana = w ? w.id : null; }
  body.atualizadoEm = new Date().toISOString();
  return body;
}

function barChart(title, rows, key){
  const vals = rows.map(r => r[key] == null ? null : Number(r[key]));
  if (!vals.some(v => v != null)) return `<div class="chart"><h3>${title}</h3><p class="small muted">Sem dados ainda.</p></div>`;
  const W = 300, H = 150, pl = 8, pb = 22, pt = 18, max = Math.max(1, ...vals.filter(v => v != null)), bw = (W - pl*2) / rows.length;
  const bars = rows.map((r,i) => { const v = vals[i], x = pl + i*bw + bw*.2, w = bw*.6, h = v == null ? 0 : Math.max(2, v/max*(H-pb-pt)), y = H-pb-h;
    return `${v != null ? `<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"><title>${esc(fmtCurto(r.inicio))}: ${fmtN(v)}</title></rect><text class="val" x="${x+w/2}" y="${y-4}" text-anchor="middle">${fmtN(v)}</text>` : ""}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(fmtCurto(r.inicio))}</text>`; }).join("");
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} por semana"><line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"/>${bars}</svg></div>`;
}

    <div class="fgrid">
      <label class="f">O quê<select id="of-modo" data-of="modo"><option value="semana"${o.modo==="semana"?" selected":""}>Semana completa</option><option value="dia"${o.modo==="dia"?" selected":""}>Um dia</option></select></label>
      <label class="f">Semana<select id="of-semana" data-of="semana">${ws.map(w => `<option value="${esc(w.id)}"${o.semana===w.id?" selected":""}>${esc(fmtCurto(w.inicio))} · ${esc(w.titulo)}</option>`).join("")}</select></label>
      ${o.modo === "dia" ? `<label class="f">Dia<input type="date" id="of-data" data-of="data" value="${esc(o.data)}"></label>
      <label class="f">Tipo<select id="of-tipo" data-of="tipo"><option${o.tipo==="Feed"?" selected":""}>Feed</option><option${o.tipo==="Storie"?" selected":""}>Storie</option></select></label>
      ${o.tipo === "Feed" ? `<label class="f">Formato<select id="of-formato" data-of="formato">${FORMATOS.map(f => `<option${o.formato===f?" selected":""}>${f}</option>`).join("")}</select></label>` : ""}` : ""}
    </div>
    <label class="f">O que queres (ideia, produto, ângulo, o que tens gravado, o que evitar)<textarea id="of-brief" data-of="brief" style="min-height:130px" placeholder="Ex.: esta semana chegam os combos ao site. Temos vídeos da Sílvia a abrir caixas e fotos dos conjuntos no jardim. Quero spoiler na segunda e revelação na quarta às 10h.">${esc(o.brief)}</textarea></label>
    <div class="row"><button class="btn primary" data-act="gerar" ${o.busy || !sample ? "disabled" : ""}>${o.busy ? "A pensar… (pode levar 1 a 2 minutos)" : "Gerar"}</button>${o.busy ? `<button class="btn" data-act="parar">Parar</button>` : ""}${!sample ? `<span class="small muted">A geração só funciona dentro do claude.ai.</span>` : ""}</div>
    ${o.err ? `<p class="small" style="color:var(--bad)">${esc(o.err)}</p>` : ""}
  </div>
  ${out ? `<div class="card"><div class="spread"><h2>Proposta</h2><div class="row"><button class="btn primary" data-act="enviarTodos">Enviar tudo para o quadro (Copy)</button><button class="btn" data-act="guardarRasc">Guardar rascunho</button><button class="btn ghost" data-act="descartar">Descartar</button></div></div>
    ${out.notaParaTania ? `<p class="chip warn" style="white-space:normal">${esc(out.notaParaTania)}</p>` : ""}
    ${(out.cartoes||[]).map((c,i) => previewCartao(c,i)).join("")}</div>` : ""}
  ${S.rascunhos.length ? `<div class="card"><h3>Rascunhos guardados</h3>${[...S.rascunhos].sort((a,b) => (b.em||"").localeCompare(a.em||"")).map(r => `<div class="spread" style="border-top:1px solid var(--line);padding-top:8px"><span>${esc(fmtQuando(r.em))} · ${esc((r.brief||"").slice(0,80))}${(r.brief||"").length>80?"…":""} · ${(r.out?.cartoes||[]).length} cartões</span><span class="row"><button class="btn" data-act="abrirRasc" data-id="${esc(r.id)}">Abrir</button><button class="btn ghost danger" data-act="apagarRasc" data-id="${esc(r.id)}">Apagar</button></span></div>`).join("")}</div>` : ""}`;
}
function previewCartao(c,i){
  const f = (l,v,cls) => v ? `<div style="display:grid;gap:2px"><span class="lbl">${l}</span><p class="readv ${cls||""}" style="${cls?"font-size:17px":""}">${esc(v)}</p></div>` : "";
  return `<div class="sec"><div class="spread"><div><span class="small muted">${esc(c.data ? fmtDia(c.data) : "")}</span><h3>${esc(c.titulo || c.tipo)}${c.formato ? " · " + esc(c.formato) : ""}</h3></div><button class="btn" data-act="enviarUm" data-i="${i}">Enviar para o quadro</button></div>
    ${f("Intenção",c.intencao)}${f("Estratégia",c.estrategia)}${f("Tema",c.tema)}${f("Como fazer",c.comoFazer)}${f("Inspiração",c.inspiracao)}${f("Legenda",c.legenda,"hand")}
    ${(c.stories||[]).map((s,j) => `<div class="sec story"><h4>Storie ${j+1} · ${s.media==="foto"?"foto":"vídeo"}</h4>${f("Intenção",s.intencao)}${f("Estratégia",s.estrategia)}${f("Tema",s.tema)}${f("Texto",s.texto,"hand")}${f("Como fazer",s.comoFazer)}</div>`).join("")}
  </div>`;
}
let genCtl = null;
async function gerar(){
  if (!sample) return;
  const o = UI.of; o.busy = true; o.err = ""; renderMain();
  genCtl = new AbortController();
  try {
    const res = await sample.json(promptOficina(), { signal: genCtl.signal, modelTier:"complex", cache:false });
    if (!res || !Array.isArray(res.cartoes)) throw { code:"invalid_json" };
    o.out = res;
  } catch(e){
    o.err = e?.code === "cancelled" ? "" : e?.code === "not_granted" ? "Não deste permissão para usar o Claude nesta página." : e?.code === "rate_limited" ? "Muitos pedidos seguidos. Espera um minuto." : e?.code === "invalid_json" ? "A resposta veio num formato que não consegui ler. Carrega em Gerar outra vez." : "Não consegui gerar. Tenta outra vez.";
  }
  o.busy = false; renderMain();
}
async function enviarParaQuadro(c){
  const data = c.data || UI.of.data || todayIso;
  const id = `${CLIENTE}-${data}-${uidShort()}`; const w = semanaDe(data);
  const tipo = c.tipo === "Storie" ? "Storie" : "Feed";
  const body = { cliente:CLIENTE, data, semana: w ? w.id : null, tipo, formato: tipo === "Feed" ? (FORMATOS.includes(c.formato) ? c.formato : "Reel") : null,
    titulo: c.titulo || "", intencao:c.intencao||"", estrategia:c.estrategia||"", tema:c.tema||"", comoFazer:c.comoFazer||"", inspiracao:c.inspiracao||"", legenda:c.legenda||"",
    stories:(c.stories||[]).map(s => ({ intencao:s.intencao||"", estrategia:s.estrategia||"", tema:s.tema||"", texto:s.texto||"", comoFazer:s.comoFazer||"", media: s.media==="foto"?"foto":"video", linkCriativo:"", linkDrive:"" })),
    linkCriativo:"", capaCriativo:"", linkDrive:"", capaDrive:"", etapa:"copy", historico:[{ etapa:"copy", por:S.me.id, em:new Date().toISOString() }], criadoEm:new Date().toISOString(), metricas:{} };
  return write(`cartoes/${id}`, body);
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { UI.tab = tab.dataset.tab; try { localStorage.setItem("td-tab2", UI.tab); } catch(x){} renderChrome(); renderMain(); return; }
  const op = e.target.closest("[data-open]");
  if (op && !e.target.closest("#modal")) { openCard(op.dataset.open); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  const card = () => S.cartoes.find(x => x.id === UI.cardId);
  switch (a) {
    case "fecharFundo": if (e.target === el) closeCard(); break;
    case "fechar": closeCard(); break;
    case "paraTi": { const pt = paraTi(); if (pt.length) { UI.tab = "quadro"; UI.semana = "todas"; renderChrome(); renderMain(); openCard(pt.sort((x,y) => x.data.localeCompare(y.data))[0].id); } break; }
    case "mes": { const [y,m] = UI.mes.split("-").map(Number); const d = new Date(y, m-1+Number(el.dataset.d), 1); UI.mes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; renderMain(); break; }
    case "novoCartao": {
      const w = S.semanas.find(x => x.id === UI.semana); const data = w ? w.inicio : todayIso; const t = el.dataset.t;
      const id = `${CLIENTE}-${data}-${uidShort()}`;
      const ok = await write(`cartoes/${id}`, { cliente:CLIENTE, data, semana: semanaDe(data)?.id || null, tipo:t, formato: t==="Feed"?"Reel":null, titulo:"", intencao:"", estrategia:"", tema:"", comoFazer:"", inspiracao:"", legenda:"", stories: t==="Feed" ? [{media:"video"}] : [{media:"video"},{media:"video"}], linkCriativo:"", capaCriativo:"", linkDrive:"", capaDrive:"", etapa:"ideia", historico:[{etapa:"ideia",por:S.me.id,em:new Date().toISOString()}], criadoEm:new Date().toISOString(), metricas:{} });
      if (ok) setTimeout(() => openCard(id), 300);
      break;
    }
    case "mover": { const c = card(); if (c) await mover(c, el.dataset.to); break; }
    case "ok": { const c = card(); if (c) { await mover(c, "drive", { aprovadoPor:S.me.id, aprovadoEm:new Date().toISOString(), alteracoes:false }); } break; }
    case "pedir": UI.pedir = true; renderModalLive(); setTimeout(() => $("#pedirTxt")?.focus(), 30); break;
    case "pedirCancelar": UI.pedir = false; renderModalLive(); break;
    case "pedirEnviar": {
      const c = card(); const t = $("#pedirTxt")?.value.trim(); if (!t) { toast("Escreve o que tem de mudar."); break; }
      const id = `${CLIENTE}-${uidShort()}`;
      await write(`comentarios/${id}`, { cliente:CLIENTE, cartao:c.id, autor:S.me.id, texto:"Alterações: " + t, em:new Date().toISOString() });
      UI.pedir = false; await mover(c, "criativo", { alteracoes:true }); break;
    }
    case "comentar": {
      const t = $("#novoCom")?.value.trim(); if (!t) break;
      const id = `${CLIENTE}-${uidShort()}`;
      if (await write(`comentarios/${id}`, { cliente:CLIENTE, cartao:UI.cardId, autor:S.me.id, texto:t, em:new Date().toISOString() })) $("#novoCom").value = "";
      break;
    }
    case "addStory": { const c = card(); const body = lerForm(c); body.stories = [...body.stories, { media:"video" }]; if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); renderModal(); } break; }
    case "rmStory": { const c = card(); const body = lerForm(c); body.stories.splice(Number(el.dataset.i),1); if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); renderModal(); } break; }
    case "askDel": $("#delZone").innerHTML = `<span class="row small">Apagar mesmo? <button type="button" class="btn danger" data-act="del">Sim</button><button type="button" class="btn" data-act="noDel">Não</button></span>`; break;
    case "noDel": $("#delZone").innerHTML = `<button type="button" class="btn ghost danger" data-act="askDel">Apagar cartão</button>`; break;
    case "del": { try { await db.doc(`cartoes/${UI.cardId}`).delete(); toast("Apagado."); } catch(x){ toast("Não apagou."); } closeCard(); break; }
    case "verSemana": UI.semana = el.dataset.id; UI.tab = "quadro"; renderChrome(); renderMain(); break;
    case "editSem": UI.editSem = el.dataset.id; renderMain(); break;
    case "cancelSem": UI.editSem = null; renderMain(); break;
    case "novaSemana": { const last = [...S.semanas].sort((x,y) => y.inicio.localeCompare(x.inicio))[0]; const ini = last ? addDays(last.fim,1) : mondayOf(todayIso); const id = `${CLIENTE}-${ini}`;
      if (await write(`semanas/${id}`, { cliente:CLIENTE, inicio:ini, fim:addDays(ini,6), titulo:"Nova semana", objetivo:"", oferta:"", palavraChave:"", estrategiaStories:"", estrategiaFeed:"", notas:"" })) { UI.editSem = id; renderMain(); } break; }
    case "editEst": UI.editEst = true; renderMain(); break;
    case "cancelEst": UI.editEst = false; renderMain(); break;
    case "editDados": UI.editDados = el.dataset.id; renderMain(); break;
    case "cancelDados": UI.editDados = null; renderMain(); break;
    case "saveDados": { const tr = el.closest("tr"); const prev = { ...(S.metricas.find(m => m.id === el.dataset.id) || {}) }; delete prev.id;
      const body = { ...prev, cliente:CLIENTE, inicio:el.dataset.ini, fim:el.dataset.fim, fonte: prev.fonte === "metricool" ? "metricool + manual" : "manual", atualizadoEm:new Date().toISOString() };
      tr.querySelectorAll("input[data-k]").forEach(i => { body[i.dataset.k] = i.value === "" ? null : Number(i.value); });
      if (await write(`metricas/${el.dataset.id}`, body)) { UI.editDados = null; toast("Guardado."); renderMain(); } break; }
    case "gerar": gerar(); break;
    case "parar": genCtl?.abort(); break;
    case "descartar": UI.of.out = null; renderMain(); break;
    case "enviarUm": { const c = UI.of.out.cartoes[Number(el.dataset.i)]; if (await enviarParaQuadro(c)) { UI.of.out.cartoes.splice(Number(el.dataset.i),1); toast("Enviado para Copy."); renderMain(); } break; }
    case "enviarTodos": { let n = 0; for (const c of [...UI.of.out.cartoes]) { if (await enviarParaQuadro(c)) n++; } UI.of.out = null; toast(`${n} cartões enviados para Copy.`); renderMain(); break; }
    case "guardarRasc": { const id = `r-${uidShort()}`; if (await write(`data/users/${S.me.id}/${id}`, { em:new Date().toISOString(), brief:UI.of.brief, semana:UI.of.semana, out:UI.of.out })) toast("Rascunho guardado."); break; }
    case "abrirRasc": { const r = S.rascunhos.find(x => x.id === el.dataset.id); if (r) { UI.of.out = r.out; UI.of.brief = r.brief || ""; if (r.semana) UI.of.semana = r.semana; renderMain(); } break; }
    case "apagarRasc": { try { await db.doc(`data/users/${S.me.id}/${el.dataset.id}`).delete(); } catch(x){} break; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.matches("[data-act=semSel]")) { UI.semana = t.value; renderMain(); }
  else if (t.matches("[data-act=relSel]")) { UI.relId = t.value; renderMain(); }
  else if (t.matches("[data-act=moverSel]")) { const c = S.cartoes.find(x => x.id === UI.cardId); if (c && t.value !== c.etapa) await mover(c, t.value); }
  else if (t.matches("[data-act=papelSel]")) { if (await write(`pessoas/${t.dataset.id}`, { papel: t.value || null }, true)) toast("Papel atualizado."); }
  else if (t.matches("[data-of]")) { UI.of[t.dataset.of] = t.value; if (t.tagName === "SELECT") renderMain(); }
});
document.addEventListener("input", e => { const t = e.target; if (t.matches("[data-of]")) UI.of[t.dataset.of] = t.value; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.cardId) closeCard(); });

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "cardForm") {
    const c = S.cartoes.find(x => x.id === UI.cardId); const body = lerForm(c);
    if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); toast("Guardado."); renderModal(); }
    return;
  }
  const fd = new FormData(f);
  if (f.dataset.form === "semana") {
    const cur = { ...(S.semanas.find(x => x.id === f.dataset.id) || {}) }; delete cur.id;
    ["inicio","fim","palavraChave","titulo","objetivo","oferta","estrategiaStories","estrategiaFeed","notas"].forEach(k => cur[k] = fd.get(k));
    if (await write(`semanas/${f.dataset.id}`, cur)) { UI.editSem = null; toast("Guardado."); renderMain(); }
  } else if (f.dataset.form === "estrategia") {
    const cur = { ...(S.cliente || {}) };
    ["nome","instagram","site","objetivo","diagnostico","ritmo","tom"].forEach(k => cur[k] = fd.get(k));
    cur.regras = String(fd.get("regras")||"").split("\n").map(s => s.trim()).filter(Boolean);
    cur.metas = { ...(cur.metas||{}) }; ["cliquesLink","dms","vendasOnline","alcance"].forEach(k => { const v = fd.get("meta_"+k); cur.metas[k] = v === "" ? null : Number(v); });
    cur.pastas = { ...(cur.pastas||{}) }; PASTAS.forEach(([k]) => { cur.pastas[k] = fd.get("pasta_"+k) || ""; });
    if (await write(`clientes/${CLIENTE}`, cur)) { UI.editEst = false; toast("Guardado."); renderMain(); }
  }
});

/* drag & drop no quadro (só a estratega) */
let dragId = null;
document.addEventListener("dragstart", e => { const t = e.target.closest(".tile[draggable]"); if (t) { dragId = t.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", e => { const col = e.target.closest("[data-col]"); if (col && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("drop", async e => { const col = e.target.closest("[data-col]"); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); if (col && dragId) { e.preventDefault(); const c = S.cartoes.find(x => x.id === dragId); dragId = null; if (c && c.etapa !== col.dataset.col) await mover(c, col.dataset.col); } });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });

renderChrome(); renderMain();
</script>
