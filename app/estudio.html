<title>Estúdio Traços D'Amor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;700&family=Patrick+Hand&display=swap">
<style>
:root{
  --bg:#FAF7F5; --surface:#FFFFFF; --sunk:#F3EDEA; --ink:#3B2E2A; --muted:#7A6862; --line:#E6DAD4;
  --terra:#B8674C; --terra-soft:#F4DDD3; --salvia:#DDE3DC; --salvia-ink:#44563F;
  --azul:#DCE5F0; --azul-ink:#34506F; --castanho:#8C675E; --castanho-soft:#EDE3DF;
  --ok:#2F7A4A; --ok-bg:#E3F2E8; --warn:#8A5A00; --warn-bg:#FFF1D6; --bad:#A33A2B; --bad-bg:#FBE3DF;
  --bar:#C9785D;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1816; --surface:#26201D; --sunk:#2F2825; --ink:#F1E8E4; --muted:#B5A49D; --line:#3D3330;
    --terra:#E3A58D; --terra-soft:#4A3129; --salvia:#323B31; --salvia-ink:#CFD9CD;
    --azul:#2C3748; --azul-ink:#C7D5E7; --castanho:#D2B2A9; --castanho-soft:#3A2F2B;
    --ok:#8FD4A6; --ok-bg:#1F3527; --warn:#F2C77A; --warn-bg:#3A2E16; --bad:#F2A596; --bad-bg:#43241F;
    --bar:#E0A18A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1816; --surface:#26201D; --sunk:#2F2825; --ink:#F1E8E4; --muted:#B5A49D; --line:#3D3330;
  --terra:#E3A58D; --terra-soft:#4A3129; --salvia:#323B31; --salvia-ink:#CFD9CD;
  --azul:#2C3748; --azul-ink:#C7D5E7; --castanho:#D2B2A9; --castanho-soft:#3A2F2B;
  --ok:#8FD4A6; --ok-bg:#1F3527; --warn:#F2C77A; --warn-bg:#3A2E16; --bad:#F2A596; --bad-bg:#43241F;
  --bar:#E0A18A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Karla,system-ui,sans-serif;padding-inline:16px;padding-block:20px 60px}
.app{max-width:1180px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px} h2{font-size:21px} h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.hand{font-family:"Patrick Hand",Karla,cursive}
.muted{color:var(--muted)}
.small{font-size:13px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:grid;gap:2px}
.brand .eyebrow{font-family:"Patrick Hand",Karla,cursive;font-size:19px;color:var(--terra)}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--terra)}
nav.tabs button:focus-visible{outline:2px solid var(--terra);outline-offset:-2px}
.panel{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--terra)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1C1816}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1C1816}}
.btn.danger{color:var(--bad)}
.btn:focus-visible,.seg button:focus-visible,.day:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label.f textarea{min-height:84px;resize:vertical;line-height:1.45}
label.f textarea.cap{font-family:"Patrick Hand",Karla,cursive;font-size:17px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
/* formato colours */
.fmt{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.fmt-Reel{background:var(--terra);color:#fff}
.fmt-Carrossel{background:var(--azul);color:var(--azul-ink)}
.fmt-Foto{background:var(--castanho);color:#fff}
.fmt-Story{background:var(--salvia);color:var(--salvia-ink)}
:root[data-theme="dark"] .fmt-Reel,:root[data-theme="dark"] .fmt-Foto{color:#1C1816}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fmt-Reel,:root:not([data-theme="light"]) .fmt-Foto{color:#1C1816}}
/* calendar */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:104px;padding:6px;display:grid;align-content:start;gap:4px;cursor:pointer;text-align:left}
.day.out{background:transparent;border-style:dashed;opacity:.55}
.day.sel{border-color:var(--terra);box-shadow:0 0 0 1px var(--terra)}
.day .dn{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;display:flex;justify-content:space-between}
.day .it{font-size:12px;line-height:1.3;display:flex;gap:4px;align-items:baseline;min-width:0}
.day .it span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.Reel{background:var(--terra)} .dot.Carrossel{background:var(--azul-ink)} .dot.Foto{background:var(--castanho)} .dot.Story{background:var(--salvia-ink)}
.wkband{grid-column:1/-1;font-size:12px;color:var(--muted);padding:6px 4px 0;display:flex;gap:8px;align-items:center}
.wkband b{color:var(--terra);font-family:"Patrick Hand",Karla,cursive;font-size:16px;font-weight:400}
.side{position:sticky;top:60px;display:grid;gap:12px;max-height:calc(100vh - 80px);overflow:auto}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.item.open{border-color:var(--terra)}
.item .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;cursor:pointer;background:none;border:0;padding:0;text-align:left;width:100%}
.est{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.est.publicado{color:var(--ok)} .est.aprovado{color:var(--azul-ink)} .est.producao{color:var(--warn)}
/* list */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td input{width:90px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-variant-numeric:tabular-nums}
/* weeks */
.week{border-left:4px solid var(--terra)}
.counts{display:flex;gap:6px;flex-wrap:wrap}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px Karla,system-ui,sans-serif}
.chart .val{fill:var(--ink);font-weight:700}
.chart rect.b{fill:var(--bar)}
.chart rect.b:hover{fill:var(--terra)}
.chart line{stroke:var(--line)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:6px}
.verdict{border-radius:12px;padding:16px;display:grid;gap:6px}
.verdict.bom{background:var(--ok-bg)} .verdict.atencao{background:var(--warn-bg)} .verdict.critico{background:var(--bad-bg)}
.verdict h2{font-size:19px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (max-width:900px){
  .cal-wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none}
}
@media (max-width:600px){
  .day{min-height:58px;padding:4px}
  .day .it span.t{display:none}
  .day .it{display:inline-flex}
  .day .items{display:flex;flex-wrap:wrap;gap:3px}
  .cal .wd{font-size:10px;padding:2px}
  .mgrid{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Estúdio de conteúdos</p>
      <h1 id="clientName">Traços D'Amor</h1>
      <p class="muted small" id="clientMeta">A carregar…</p>
    </div>
    <div class="status" id="statusChips"></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Secções">
    <button role="tab" data-tab="calendario">Calendário</button>
    <button role="tab" data-tab="semanas">Semanas</button>
    <button role="tab" data-tab="estrategia">Estratégia</button>
    <button role="tab" data-tab="dados">Dados</button>
    <button role="tab" data-tab="relatorios">Relatórios</button>
  </nav>

  <main id="main" class="panel">
    <div class="empty"><p>A ligar à base de dados…</p></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const CLIENTE = "tracosdamor";
const FORMATOS = ["Reel","Carrossel","Foto","Story"];
const ESTADOS = [["ideia","Ideia"],["producao","Em produção"],["aprovado","Aprovado"],["publicado","Publicado"]];
const METRICAS_POST = [["alcance","Alcance"],["visualizacoes","Visualizações"],["gostos","Gostos"],["comentarios","Comentários"],["partilhas","Partilhas"],["guardados","Guardados"],["cliques","Cliques no link"],["respostas","Respostas / DMs"]];
const METRICAS_SEM = [["seguidores","Seguidores"],["novosSeguidores","Novos seguidores"],["alcance","Alcance"],["visualizacoes","Visualizações"],["interacoes","Interações"],["visitasPerfil","Visitas ao perfil"],["cliquesLink","Cliques no link"],["dms","DMs de venda"],["vendasOnline","Vendas online"],["receita","Receita (€)"]];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];

let db = null;
const S = { cliente:null, semanas:[], conteudos:[], metricas:[], relatorios:[], loaded:{} };
const UI = { tab:"calendario", mes:"2026-10", dia:null, aberto:null, filtro:"todos", vista:"mes", relSemana:null, editSem:null, editDados:null, confirmDel:null };

try { const t = localStorage.getItem("td-tab"); if (t) UI.tab = t; } catch(e){}
if (/^#(calendario|semanas|estrategia|dados|relatorios)$/.test(location.hash)) UI.tab = location.hash.slice(1);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); };
const fmtDia = s => { const d = parse(s); return `${DIAS[(d.getDay()+6)%7]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fmtCurto = s => { const d = parse(s); return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`; };
const num = v => (v === null || v === undefined || v === "") ? null : Number(v);
const fmtN = v => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("pt-PT");
const semanaId = inicio => `${CLIENTE}-${inicio}`;
const todayIso = iso(new Date());

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 2600); }

async function write(path, data, merge){
  if (!db) { toast("Sem ligação à base de dados."); return false; }
  try {
    const ref = db.doc(path);
    if (merge) await ref.update(data); else await ref.set(data);
    return true;
  } catch(e){
    toast(e && e.code === "invalid_argument" ? "Não tens permissão para editar." : "Não gravou. Tenta outra vez.");
    return false;
  }
}

/* ---------- data ---------- */
function sub(name, q){
  q.onSnapshot(snap => {
    S[name] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    S.loaded[name] = true; render();
  }, err => { S.loaded[name] = true; render(); });
}
(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { S.nodb = true; render(); return; }
  db.doc(`clientes/${CLIENTE}`).onSnapshot(s => { S.cliente = s.exists ? s.data() : null; S.loaded.cliente = true; render(); }, () => { S.loaded.cliente = true; render(); });
  sub("semanas",   db.collection("semanas").where("cliente","==",CLIENTE));
  sub("conteudos", db.collection("conteudos").where("cliente","==",CLIENTE));
  sub("metricas",  db.collection("metricas").where("cliente","==",CLIENTE));
  sub("relatorios",db.collection("relatorios").where("cliente","==",CLIENTE));
})();

const byDate = (a,b) => (a.data||"").localeCompare(b.data||"") || (FORMATOS.indexOf(a.formato) - FORMATOS.indexOf(b.formato)) || ((a.ordem||0)-(b.ordem||0));
const semanaDe = dataIso => S.semanas.find(w => w.inicio <= dataIso && dataIso <= w.fim);

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === UI.tab));
  const c = S.cliente;
  if (c) {
    $("#clientName").textContent = c.nome || "Traços D'Amor";
    $("#clientMeta").textContent = [c.instagram, c.site].filter(Boolean).join(" · ");
  }
  const lig = c?.ligacaoInstagram;
  const lastM = [...S.metricas].sort((a,b)=>(b.inicio||"").localeCompare(a.inicio||""))[0];
  $("#statusChips").innerHTML =
    (lig === "metricool" ? `<span class="chip ok">● Instagram ligado (Metricool)</span>` : `<span class="chip warn">● Instagram por ligar · dados manuais</span>`) +
    (lastM?.atualizadoEm ? `<span class="chip neutral">Dados até ${esc(fmtCurto(lastM.fim || lastM.inicio))}</span>` : "");

  const main = $("#main");
  if (S.nodb) { main.innerHTML = `<div class="empty"><h3>Abre esta página no claude.ai</h3><p>A aplicação precisa da base de dados da página, que só está disponível dentro do claude.ai.</p></div>`; return; }
  if (!S.loaded.conteudos) { main.innerHTML = `<div class="empty"><p>A carregar conteúdos…</p></div>`; return; }
  ({calendario:renderCal, semanas:renderSemanas, estrategia:renderEstrategia, dados:renderDados, relatorios:renderRelatorios}[UI.tab] || renderCal)(main);
}

/* ---- calendário ---- */
function renderCal(main){
  const [y,m] = UI.mes.split("-").map(Number);
  const first = `${y}-${pad(m)}-01`;
  const start = mondayOf(first);
  const lastDay = new Date(y, m, 0).getDate();
  const end = addDays(mondayOf(`${y}-${pad(m)}-${pad(lastDay)}`), 6);
  const lista = S.conteudos.filter(x => UI.filtro === "todos" || x.formato === UI.filtro).sort(byDate);
  const porDia = {};
  lista.forEach(x => (porDia[x.data] ||= []).push(x));

  if (!UI.dia) UI.dia = (todayIso >= start && todayIso <= end) ? todayIso : (lista.find(x => x.data >= first)?.data || first);

  const tot = f => S.conteudos.filter(x => x.data >= first && x.data <= `${y}-${pad(m)}-${pad(lastDay)}` && (!f || x.formato === f)).length;
  const pub = S.conteudos.filter(x => x.data >= first && x.data <= `${y}-${pad(m)}-${pad(lastDay)}` && x.estado === "publicado").length;

  let cells = DIAS.map(d => `<div class="wd">${d}</div>`).join("");
  for (let d = start; d <= end; d = addDays(d,1)) {
    const dow = (parse(d).getDay()+6)%7;
    if (dow === 0) {
      const w = S.semanas.find(s => s.inicio === d);
      if (w) cells += `<div class="wkband"><b>${esc(w.titulo || "")}</b>${w.palavraChave ? `<span>palavra-chave ${esc(w.palavraChave)}</span>` : ""}</div>`;
    }
    const its = porDia[d] || [];
    const out = d.slice(0,7) !== UI.mes;
    cells += `<button class="day${out?" out":""}${d===UI.dia?" sel":""}" data-dia="${d}" aria-label="${esc(fmtDia(d))}, ${its.length} conteúdos">
      <span class="dn"><span>${parse(d).getDate()}</span>${d===todayIso?'<span class="chip neutral" style="padding:0 6px">hoje</span>':""}</span>
      <span class="items">${its.map(x => `<span class="it"><span class="dot ${esc(x.formato)}"></span><span class="t">${esc(x.formato==="Story"?"Story":(x.tema||x.formato))}</span></span>`).join("")}</span>
    </button>`;
  }

  const listaView = UI.vista === "lista";
  main.innerHTML = `
  <div class="spread">
    <div class="row">
      <button class="btn" data-act="mes" data-d="-1" aria-label="Mês anterior">‹</button>
      <h2 style="min-width:170px;text-align:center">${MESES[m-1][0].toUpperCase()+MESES[m-1].slice(1)} ${y}</h2>
      <button class="btn" data-act="mes" data-d="1" aria-label="Mês seguinte">›</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Filtrar formato">${["todos",...FORMATOS].map(f => `<button data-act="filtro" data-f="${f}" aria-pressed="${UI.filtro===f}">${f==="todos"?"Todos":f}</button>`).join("")}</div>
      <div class="seg" role="group" aria-label="Vista">${[["mes","Mês"],["lista","Lista"]].map(([k,l]) => `<button data-act="vista" data-v="${k}" aria-pressed="${UI.vista===k}">${l}</button>`).join("")}</div>
    </div>
  </div>
  <div class="row small muted">
    <span><span class="dot Reel"></span> Reel ${tot("Reel")}</span>
    <span><span class="dot Carrossel"></span> Carrossel ${tot("Carrossel")}</span>
    <span><span class="dot Foto"></span> Foto ${tot("Foto")}</span>

function renderDia(dia, its){

function barChart(title, rows, key){
  const vals = rows.map(r => num(r[key]));
  if (!vals.some(v => v != null)) return `<div class="chart"><h3>${title}</h3><p class="small muted">Sem dados ainda.</p></div>`;
  const W = 300, H = 150, padL = 8, padB = 22, padT = 18;
  const max = Math.max(1, ...vals.filter(v => v != null));
  const bw = (W - padL*2) / rows.length;
  const bars = rows.map((r,i) => {
    const v = vals[i]; const x = padL + i*bw + bw*0.2; const w = bw*0.6;
    const h = v == null ? 0 : Math.max(2, (v/max)*(H - padB - padT));
    const y = H - padB - h;
    return `${v != null ? `<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"><title>${esc(fmtCurto(r.inicio))}: ${fmtN(v)}</title></rect>
      <text class="val" x="${x + w/2}" y="${y - 4}" text-anchor="middle">${fmtN(v)}</text>` : ""}
      <text x="${x + w/2}" y="${H - 6}" text-anchor="middle">${esc(fmtCurto(r.inicio))}</text>`;
  }).join("");
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} por semana"><line x1="${padL}" x2="${W-padL}" y1="${H-padB}" y2="${H-padB}"/>${bars}</svg></div>`;
}

function lst(t, arr, fn, ordered){
  if (!arr || !arr.length) return "";
  const tag = ordered ? "ol" : "ul";
  return `<div class="card"><h3>${t}</h3><${tag} class="clean">${arr.map(x => `<li>${fn ? fn(x) : esc(x)}</li>`).join("")}</${tag}></div>`;
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "mes") { const [y,m] = UI.mes.split("-").map(Number); const d = new Date(y, m-1+Number(el.dataset.d), 1); UI.mes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; UI.dia = `${UI.mes}-01`; UI.aberto = null; render(); }
  else if (a === "filtro") { UI.filtro = el.dataset.f; render(); }
  else if (a === "vista") { UI.vista = el.dataset.v; render(); }
  else if (a === "toggle") { e.preventDefault(); UI.aberto = UI.aberto === el.dataset.id ? null : el.dataset.id; UI.confirmDel = null; render(); }
  else if (a === "abrir") { UI.vista = "mes"; UI.dia = el.dataset.dia; UI.aberto = el.dataset.id; render(); }
  else if (a === "novo") {
    const id = `${CLIENTE}-${UI.dia}-${Date.now().toString(36)}`;
    const w = semanaDe(UI.dia);
    const ok = await write(`conteudos/${id}`, { cliente:CLIENTE, data:UI.dia, formato:el.dataset.f, estado:"ideia", semana: w ? w.id : null, tema:"", gancho:"", legenda:"", cta:"", link:"", notas:"", ordem: Date.now(), metricas:{} });
    if (ok) { UI.aberto = id; toast("Criado."); render(); }
  }
  else if (a === "askdel") { e.preventDefault(); UI.confirmDel = el.dataset.id; render(); }
  else if (a === "nodel") { e.preventDefault(); UI.confirmDel = null; render(); }
  else if (a === "del") { e.preventDefault(); try { await db.doc(`conteudos/${el.dataset.id}`).delete(); toast("Apagado."); } catch(err){ toast("Não apagou."); } UI.confirmDel = null; UI.aberto = null; render(); }
  else if (a === "editSem") { UI.editSem = el.dataset.id; render(); }
  else if (a === "cancelSem") { UI.editSem = null; render(); }
  else if (a === "novaSemana") {
    const last = [...S.semanas].sort((x,y) => y.inicio.localeCompare(x.inicio))[0];
    const ini = last ? addDays(last.fim, 1) : mondayOf(todayIso);
    const id = semanaId(ini);
    if (await write(`semanas/${id}`, { cliente:CLIENTE, inicio:ini, fim:addDays(ini,6), titulo:"Nova semana", objetivo:"", oferta:"", palavraChave:"", estrategiaStories:"", estrategiaFeed:"", notas:"" })) { UI.editSem = id; render(); }
  }
  else if (a === "editEst") { UI.editEst = true; render(); }
  else if (a === "cancelEst") { UI.editEst = false; render(); }
  else if (a === "editDados") { UI.editDados = el.dataset.id; render(); }
  else if (a === "cancelDados") { UI.editDados = null; render(); }
  else if (a === "saveDados") {
    const tr = el.closest("tr"); const data = { cliente:CLIENTE, inicio:el.dataset.ini, fim:el.dataset.fim, fonte:"manual", atualizadoEm:new Date().toISOString() };
    const prev = S.metricas.find(m => m.id === el.dataset.id) || {};
    tr.querySelectorAll("input[data-k]").forEach(i => { data[i.dataset.k] = i.value === "" ? null : Number(i.value); });
    const body = { ...prev, ...data }; delete body.id;
    if (await write(`metricas/${el.dataset.id}`, body)) { UI.editDados = null; toast("Guardado."); render(); }
  }
});
document.addEventListener("click", e => {
  const d = e.target.closest("button.day"); if (!d) return;
  UI.dia = d.dataset.dia; UI.aberto = null; UI.confirmDel = null; render();
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-act=relSel]")) { UI.relSemana = e.target.value; render(); }
});

document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]"); if (!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.form === "item") {
    const id = f.dataset.id; const cur = S.conteudos.find(x => x.id === id) || {};
    const metricas = {}; METRICAS_POST.forEach(([k]) => { const v = fd.get("m_"+k); metricas[k] = v === "" ? null : Number(v); });
    const data = fd.get("data");
    const w = semanaDe(data);
    const body = { ...cur, data, formato:fd.get("formato"), estado:fd.get("estado"), tema:fd.get("tema"), gancho:fd.get("gancho"), legenda:fd.get("legenda"), cta:fd.get("cta"), link:fd.get("link"), notas:fd.get("notas"), semana: w ? w.id : null, metricas };
    delete body.id;
    if (await write(`conteudos/${id}`, body)) { toast("Guardado."); UI.dia = data; if (data.slice(0,7) !== UI.mes) UI.mes = data.slice(0,7); }
  } else if (f.dataset.form === "semana") {
    const id = f.dataset.id; const cur = S.semanas.find(x => x.id === id) || {};
    const body = { ...cur }; delete body.id;
    ["inicio","fim","palavraChave","titulo","objetivo","oferta","estrategiaStories","estrategiaFeed","notas"].forEach(k => body[k] = fd.get(k));
    if (await write(`semanas/${id}`, body)) { UI.editSem = null; toast("Guardado."); }
  } else if (f.dataset.form === "estrategia") {
    const cur = { ...(S.cliente || {}) };
    ["nome","instagram","site","objetivo","diagnostico","ritmo","tom"].forEach(k => cur[k] = fd.get(k));
    cur.regras = String(fd.get("regras")||"").split("\n").map(s => s.trim()).filter(Boolean);
    cur.metas = { ...(cur.metas||{}) };
    ["cliquesLink","dms","vendasOnline","alcance"].forEach(k => { const v = fd.get("meta_"+k); cur.metas[k] = v === "" ? null : Number(v); });
    if (await write(`clientes/${CLIENTE}`, cur)) { UI.editEst = false; toast("Guardado."); }
  }
});

render();
</script>
