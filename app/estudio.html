*{box-sizing:border-box}

.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;justify-content:flex-end}

.linkrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}

.readv{white-space:pre-line}

.box.b-obj{border-top-color:var(--td-terra)} .box.b-of{border-top-color:var(--td-castanho)} .box.b-feed{border-top-color:var(--td-azul)} .box.b-st{border-top-color:var(--td-salvia)}

<div class="app">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Estúdio de conteúdos</p>
      <h1 id="clientName">Traços D'Amor</h1>
      <p class="muted small" id="clientMeta">A carregar…</p>
    </div>
    <div class="status" id="statusChips"></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secções" id="tabs"></nav>
  <main id="main" class="panel"><div class="empty"><p>A ligar à base de dados…</p></div></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
const CLIENTE = "tracosdamor";
const PRIV = `privado/${CLIENTE}`;
const ETAPAS = [["ideia","Ideia"],["criativo","Criativo"],["revisao","Revisão estratégica"],["cliente","Aprovação cliente"],["aprovado","Aprovado"],["publicado","Publicado"]];
const ETQ = Object.fromEntries(ETAPAS);
const normEtapa = e => e === "copy" ? "ideia" : e === "drive" ? "aprovado" : e;
const IDX = Object.fromEntries(ETAPAS.map(([k],i)=>[k,i]));
const FORMATOS = ["Reel","Carrossel","Estático"];
const PASTAS = [["reels","Vídeos Reels"],["capas","Capas Reels"],["storyVideo","Vídeos Story"],["storyFoto","Fotos Story"],["feedFoto","Estáticos / Carrosséis"]];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DIAS_L = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const METRICAS_SEM = [["seguidores","Seguidores"],["novosSeguidores","Novos seguidores"],["alcance","Alcance"],["visualizacoes","Visualizações"],["interacoes","Interações"],["visitasPerfil","Visitas ao perfil"],["cliquesLink","Cliques no link"],["dms","DMs de venda"],["vendasOnline","Vendas online"],["receita","Receita (€)"]];
const METRICAS_POST = [["alcance","Alcance"],["visualizacoes","Visualizações"],["gostos","Gostos"],["comentarios","Comentários"],["partilhas","Partilhas"],["guardados","Guardados"],["cliques","Cliques no link"],["respostas","Respostas / DMs"]];
const PAPEL_TXT = { dona:"Estratega", equipa:"Equipa criativa", cliente:"Cliente" };

let db = null, userCap = null, sample = null;
const S = { cliente:null, priv:null, semanas:[], cartoes:[], comentarios:[], inspiracoes:[], pessoas:[], metricas:[], resultados:[], perguntas:[], relatorios:[], rascunhos:[], loaded:{}, me:{ id:null, isOwner:false }, names:{} };
const UI = { tab:"quadro", vista:"semanas", semana:"todas", semAberta:null, mes:"2026-10", cardId:null, pend:false, editSem:null, editEst:false, editDados:null, relId:null, editMelh:null, qaBusy:false, qaTxt:"",
  of:{ modo:"semana", semanas:[], data:"", tipo:"Feed", formato:"Reel", brief:"", busy:false, prog:"", out:[], err:"" } };
try { const t = localStorage.getItem("td-tab3"); if (t) UI.tab = t; const v = localStorage.getItem("td-vista"); if (v) UI.vista = v; } catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const dow = s => (parse(s).getDay()+6)%7;
const fmtCurto = s => { if (!s) return ""; const d = parse(s); return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`; };
const fmtLongo = s => { const d = parse(s); return `${pad(d.getDate())} de ${MESES[d.getMonth()]}`; };
const fmtDia = s => { const d = parse(s); return `${DIAS_L[dow(s)]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fmtN = v => v == null || v === "" || isNaN(v) ? "—" : Number(v).toLocaleString("pt-PT");
const fmtQuando = t => { try { const d = new Date(t); return d.toLocaleDateString("pt-PT",{day:"numeric",month:"short"}) + " " + d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } };
const todayIso = iso(new Date());
const uidShort = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const semanasOrd = () => [...S.semanas].sort((a,b) => a.inicio.localeCompare(b.inicio));
const semanaDe = d => S.semanas.find(w => w.inicio <= d && d <= w.fim);
const mesDe = w => w.inicio.slice(0,7);
const numSemana = w => w.numero || (semanasOrd().filter(x => mesDe(x) === mesDe(w) && x.inicio <= w.inicio).length);
const nomeSemana = w => `Semana ${numSemana(w)}`;
const semanaAtual = () => { const ws = semanasOrd(); return ws.find(w => w.fim >= todayIso) || ws[ws.length-1]; };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 2800); }

/* ---------- pessoas ---------- */
function papel(){ if (S.me.isOwner) return "dona"; const p = S.pessoas.find(x => x.id === S.me.id); return p?.papel === "equipa" ? "equipa" : "cliente"; }
const isDona = () => papel() === "dona";
function papelDe(id){ const p = S.pessoas.find(x => x.id === id); return p?.papel || (id === S.me.id ? papel() : "cliente"); }
function nomeDe(id){ const p = S.pessoas.find(x => x.id === id); return p?.nome || S.names[id] || (id === S.me.id ? "Tu" : PAPEL_TXT[papelDe(id)] || "Alguém"); }
function quem(id){ const pp = papelDe(id); return `${esc(nomeDe(id))} <span class="role ${pp}">${esc(PAPEL_TXT[pp]||"")}</span>`; }
function visivel(c){ return papel() !== "cliente" || IDX[c.etapa] >= IDX.cliente; }

/* ---------- db ---------- */
function localMerge(id, body){ const i = S.cartoes.findIndex(x => x.id === id); if (i >= 0) S.cartoes[i] = { ...S.cartoes[i], ...body }; }
async function write(path, data, merge){
  if (!db) { toast("Sem ligação à base de dados."); return false; }
  try { const r = db.doc(path); if (merge) await r.update(data); else await r.set(data); return true; }
  catch(e){ toast(e && e.code === "invalid_argument" ? "Não tens permissão para isto." : "Não gravou. Tenta outra vez."); return false; }
}
function sub(name, q){ q.onSnapshot(snap => { S[name] = snap.docs.map(d => { const o = { id:d.id, ...d.data() }; if (name === "cartoes") o.etapa = normEtapa(o.etapa); return o; }); S.loaded[name] = true; onData(name); }, () => { S.loaded[name] = true; onData(name); }); }
function isEditing(){ const a = document.activeElement; return UI.editSem || UI.editEst || UI.editDados || UI.editMelh || (a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
function onData(name){
  if (["comentarios","pessoas","inspiracoes"].includes(name)) resolveNames();
  renderChrome();
  if (UI.cardId) renderModalLive();
  if (isEditing()) { UI.pend = true; return; }
  renderMain();
}
document.addEventListener("focusout", () => setTimeout(() => { if (UI.pend && !isEditing()) { UI.pend = false; renderMain(); } }, 60));
async function resolveNames(){
  if (!userCap) return;
  const ids = [...new Set([...S.comentarios.map(c => c.autor), ...S.inspiracoes.map(c => c.autor), ...S.pessoas.map(p => p.id)].filter(Boolean))].filter(id => !(id in S.names));
  if (!ids.length) return;
  ids.forEach(id => { S.names[id] = ""; });
  try { const ps = await userCap.profiles(ids); ids.forEach(id => { S.names[id] = ps[id]?.name || ""; }); renderMainSafe(); if (UI.cardId) renderModalLive(); } catch(e){}
}
function renderMainSafe(){ if (isEditing()) { UI.pend = true; } else renderMain(); }

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { S.nodb = true; renderChrome(); renderMain(); return; }
  userCap = await window.claude?.use?.("user") ?? null;
  if (userCap) { const me = await userCap.me(); S.me = { id: me.id, isOwner: me.isOwner }; if (me.id && me.name) S.names[me.id] = me.name; }
  db.doc(`clientes/${CLIENTE}`).onSnapshot(s => { S.cliente = s.exists ? s.data() : null; onData("cliente"); }, () => {});
  for (const c of ["semanas","cartoes","comentarios","inspiracoes","pessoas","relatorios"]) sub(c, db.collection(c).where("cliente","==",CLIENTE));
  if (S.me.isOwner) {
    db.doc(PRIV).onSnapshot(s => { S.priv = s.exists ? s.data() : null; onData("priv"); }, () => {});
    sub("metricas", db.collection(`${PRIV}/metricas`));
    sub("resultados", db.collection(`${PRIV}/resultados`));
    sub("perguntas", db.collection(`${PRIV}/perguntas`));
    if (S.me.id) sub("rascunhos", db.collection(`data/users/${S.me.id}`));
    sample = await window.claude?.use?.("sample") ?? null;
  }
  if (S.me.id) {
    try { const s = await db.doc(`pessoas/${S.me.id}`).get();
      if (!s.exists) await db.doc(`pessoas/${S.me.id}`).set({ cliente:CLIENTE, papel: S.me.isOwner ? "dona" : null, nome: S.me.isOwner ? "Tânia" : "", desde:new Date().toISOString() });
    } catch(e){}
  }
  renderChrome(); renderMain();
})();

/* ---------- chrome ---------- */
function paraTi(){ const p = papel(); if (p === "equipa") return S.cartoes.filter(c => c.etapa === "criativo" || (c.etapa === "aprovado" && faltaDrive(c).length)); const alvo = p === "dona" ? ["revisao"] : ["cliente"]; return S.cartoes.filter(c => alvo.includes(c.etapa)); }
const avaliado = c => { const r = S.resultados.find(x => x.id === c.id); return !!r && ((r.feed && Object.values(r.feed).some(v => v != null)) || (r.stories||[]).some(m => m && Object.values(m).some(v => v != null))); };
function renderChrome(){
  const c = S.cliente;
  if (c) { $("#clientName").textContent = c.nome || "Traços D'Amor"; $("#clientMeta").textContent = [c.instagram, c.site].filter(Boolean).join(" · "); }
  const p = papel(); const pt = paraTi();
  $("#statusChips").innerHTML = `<span class="chip neutral">${esc(PAPEL_TXT[p])}</span>` +
    (pt.length ? `<button class="chip bad" data-act="paraTi">● ${pt.length} à tua espera</button>` : `<span class="chip ok">Nada à tua espera</span>`);
  const pub = [["quadro","Quadro"],["calendario","Calendário"],["semanas","Semanas"],["relatorios","Relatórios"]];
  const priv = p === "dona" ? [["estrategia","Estratégia 🔒"],["dados","Dados 🔒"],["oficina","Oficina 🔒"]] : [];
  if (![...pub,...priv].find(t => t[0] === UI.tab)) UI.tab = "quadro";
  $("#tabs").innerHTML = pub.map(([k,l]) => `<button role="tab" data-tab="${k}" aria-selected="${UI.tab===k}">${l}</button>`).join("") +
    (priv.length ? `<span class="sep" aria-hidden="true"></span>` + priv.map(([k,l]) => `<button role="tab" data-tab="${k}" aria-selected="${UI.tab===k}" class="priv">${l}</button>`).join("") : "");
}
function renderMain(){
  const main = $("#main");
  if (S.nodb) { main.innerHTML = `<div class="empty"><h3>Abre esta página no claude.ai</h3><p>A aplicação precisa da base de dados, que só existe dentro do claude.ai.</p></div>`; return; }
  if (!S.loaded.cartoes) { main.innerHTML = `<div class="empty"><p>A carregar…</p></div>`; return; }
  const priv = { estrategia:renderEstrategia, dados:renderDados, oficina:renderOficina };
  if (priv[UI.tab] && !isDona()) UI.tab = "quadro";
  ({quadro:renderQuadro, calendario:renderCal, semanas:renderSemanas, relatorios:renderRelatorios, ...priv}[UI.tab] || renderQuadro)(main);
}

/* ---------- cartões ---------- */
function checklist(c){
  const items = []; const feed = c.tipo === "Feed";
  if (feed) {
    items.push(["Copy para Design", !!(c.tema && c.comoFazer)]);
    if (c.formato === "Reel") items.push(["Capa Canva Reels", !!c.capaCriativo], ["Capa Final (Drive)", !!c.capaDrive]);
    items.push([c.formato === "Reel" ? "Link Canva Reels" : "Link Canva", !!c.linkCriativo], [c.formato === "Reel" ? "Link final Reels (Drive)" : "Link final (Drive)", !!c.linkDrive], ["Legenda", !!c.legenda]);
  }
  (c.stories||[]).forEach((s,i) => { const n = c.stories.length > 1 ? ` ${i+1}` : ""; items.push([`Copy para Storie${n}`, !!(s.texto || s.tema)], [`Link Canva storie${n}`, !!s.linkCriativo], [`Link Storie Final (Drive)${n}`, !!s.linkDrive]); });
  return items;
}
const faltaDrive = c => checklist(c).filter(([n,ok]) => /Drive/.test(n) && !ok).map(x => x[0]);
const faltaCriativo = c => checklist(c).filter(([n,ok]) => /Canva/.test(n) && !ok).map(x => x[0]);
const nComs = id => S.comentarios.filter(x => x.cartao === id && !x.sistema).length;
const tituloCartao = c => c.titulo || `${DIAS_L[dow(c.data)]}: ${c.tipo}`;
function tile(c, drag){
  const ch = checklist(c);
  return `<button class="tile s-${esc(c.etapa)}" data-open="${esc(c.id)}" ${drag?'draggable="true"':""} data-id="${esc(c.id)}">
    <span class="meta"><span class="et et-${esc(c.etapa)}">${esc(ETQ[c.etapa])}</span><span>${esc(fmtCurto(c.data))}</span></span>
    <span class="t">${esc(tituloCartao(c))}${c.tipo==="Feed" && c.formato ? ` <span class="muted" style="font-weight:400">· ${esc(c.formato)}</span>` : ""}</span>
    ${(c.tema || c.stories?.[0]?.tema) ? `<span class="small muted">${esc(c.tema || c.stories[0].tema)}</span>` : ""}
    <span class="meta"><span>☑ ${ch.filter(x=>x[1]).length}/${ch.length}</span>${nComs(c.id) ? `<span>💬 ${nComs(c.id)}</span>` : ""}${c.alteracoes ? `<span class="chip bad" style="padding:0 6px">alterações</span>` : ""}${isDona() && c.etapa === "publicado" ? (avaliado(c) ? `<span class="chip ok" style="padding:0 6px">avaliado</span>` : `<span class="chip warn" style="padding:0 6px">avaliação pendente</span>`) : ""}</span>
  </button>`;
}

/* ---------- quadro ---------- */
function coverSemana(w){
  return `<button class="cover" data-act="abrirSemana" data-id="${esc(w.id)}" aria-label="${esc(nomeSemana(w))}, ${esc(w.titulo)}">
    <span class="art" data-mark="T"><span>${esc(nomeSemana(w))}</span></span>
    <span class="foot"><span>${esc(fmtLongo(w.inicio))} a ${esc(fmtLongo(w.fim))}</span><span class="small muted">${esc(w.titulo)}</span></span>
  </button>`;
}
function coverMes(ym){
  const [y,m] = ym.split("-").map(Number);
  return `<div class="cover light" style="cursor:default"><span class="art" data-mark="T"><span>Estratégia de ${cap1(MESES[m-1])}</span></span><span class="foot"><span>${cap1(MESES[m-1])} ${y}</span></span></div>`;
}
function renderQuadro(main){
  const p = papel();
  const vistaSeg = `<div class="seg" role="group" aria-label="Vista">${[["semanas","Por semana"],["etapas","Por etapa"]].map(([k,l]) => `<button data-act="vista" data-v="${k}" aria-pressed="${UI.vista===k}">${l}</button>`).join("")}</div>`;
  if (UI.vista === "semanas") {
    const ws = semanasOrd(); let cols = ""; let mesAtual = "";
    for (const w of ws) {
      if (mesDe(w) !== mesAtual) {
        mesAtual = mesDe(w);
        const doMes = ws.filter(x => mesDe(x) === mesAtual);
        cols += `<section class="col" aria-label="Mês"><div class="colhd"><span>${cap1(MESES[Number(mesAtual.slice(5))-1])}</span><span class="n">${doMes.length} semanas</span></div>${coverMes(mesAtual)}
          ${doMes.map(x => `<button class="wklink" data-act="abrirSemana" data-id="${esc(x.id)}"><b>${esc(nomeSemana(x))}</b> · ${esc(x.titulo)}</button>`).join("")}</section>`;
      }
      const its = S.cartoes.filter(c => c.data >= w.inicio && c.data <= w.fim && visivel(c)).sort((a,b) => a.data.localeCompare(b.data) || (a.tipo==="Feed"?-1:1));
      cols += `<section class="col" aria-label="${esc(nomeSemana(w))}"><div class="colhd"><span>${cap1(MESES[parse(w.inicio).getMonth()])}</span><span class="n">${its.length}</span></div>
        ${coverSemana(w)}${its.map(c => tile(c, false)).join("")}
        ${p === "dona" ? `<button class="addcard" data-act="novoCartao" data-sem="${esc(w.id)}">+ Adicionar um cartão</button>` : ""}</section>`;
    }
    main.innerHTML = `<div class="spread"><div class="row">${vistaSeg}</div>${p === "dona" ? `<button class="btn" data-act="novaSemana">+ Nova semana</button>` : ""}</div>
      ${ws.length ? `<div class="board">${cols}</div>` : `<div class="empty"><p>Sem semanas.</p></div>`}`;
    return;
  }
  const cards = filtroSemana(S.cartoes.filter(visivel)).sort((a,b) => a.data.localeCompare(b.data));
  const cols = p === "cliente" ? ETAPAS.filter(([k]) => IDX[k] >= IDX.cliente) : ETAPAS;
  main.innerHTML = `<div class="spread"><div class="row">${vistaSeg}${semanaPicker()}</div></div>
  <div class="board" style="grid-auto-columns:minmax(240px,1fr)">${cols.map(([k,l]) => { const its = cards.filter(c => c.etapa === k);
    return `<section class="col ${k}" data-col="${k}" aria-label="${esc(l)}"><div class="colhd"><span>${esc(l)}</span><span class="n">${its.length}</span></div>${its.map(c => tile(c, p === "dona")).join("") || `<p class="small" style="opacity:.6;padding:4px">Vazio</p>`}</section>`; }).join("")}</div>
  ${p === "dona" ? `<p class="small muted">Arrasta os cartões entre colunas, ou abre um cartão e usa os botões.</p>` : ""}`;
}
function filtroSemana(list){ if (UI.semana === "todas") return list; const w = S.semanas.find(x => x.id === UI.semana); return w ? list.filter(c => c.data >= w.inicio && c.data <= w.fim) : list; }
function semanaPicker(){ return `<select class="inp" style="width:auto" data-act="semSel" id="semSel" aria-label="Semana"><option value="todas">Todas as semanas</option>${semanasOrd().map(w => `<option value="${esc(w.id)}"${UI.semana===w.id?" selected":""}>${esc(nomeSemana(w))} · ${esc(fmtCurto(w.inicio))} – ${esc(fmtCurto(w.fim))}</option>`).join("")}</select>`; }

/* ---------- calendário ---------- */
function renderCal(main){
  const [y,m] = UI.mes.split("-").map(Number);
  const first = `${y}-${pad(m)}-01`; const lastDay = new Date(y, m, 0).getDate();
  const start = mondayOf(first); const end = addDays(mondayOf(`${y}-${pad(m)}-${pad(lastDay)}`), 6);
  const porDia = {}; S.cartoes.filter(visivel).forEach(c => (porDia[c.data] ||= []).push(c));
  let cells = DIAS.map(d => `<div class="wd">${d}</div>`).join("");
  for (let d = start; d <= end; d = addDays(d,1)) {
    if (dow(d) === 0) { const w = S.semanas.find(s => s.inicio === d); if (w) cells += `<div class="wkband"><b>${esc(nomeSemana(w))}</b> · ${esc(w.titulo)}</div>`; }
    const its = (porDia[d]||[]).sort((a,b) => (a.tipo==="Feed"?0:1)-(b.tipo==="Feed"?0:1));
    cells += `<div class="day${d.slice(0,7)!==UI.mes?" out":""}"><span class="dn"><span>${parse(d).getDate()}</span>${d===todayIso?'<span class="chip neutral" style="padding:0 6px">hoje</span>':""}</span>
      ${its.map(c => `<button class="et et-${esc(c.etapa)}" data-open="${esc(c.id)}" title="${esc(tituloCartao(c))} · ${esc(ETQ[c.etapa])}">${esc(c.tipo==="Feed"?(c.formato||"Feed"):"Stories")}</button>`).join("")}</div>`;
  }
  main.innerHTML = `<div class="spread">
    <div class="row"><button class="btn" data-act="mes" data-d="-1" aria-label="Mês anterior">‹</button><h2 style="min-width:170px;text-align:center">${cap1(MESES[m-1])} ${y}</h2><button class="btn" data-act="mes" data-d="1" aria-label="Mês seguinte">›</button></div>
    <div class="row small">${ETAPAS.map(([k,l]) => `<span class="et et-${k}">${l}</span>`).join("")}</div></div>
  <div class="cal">${cells}</div>`;
}

/* ---------- modal cartão ---------- */
function openCard(id){ UI.cardId = id; UI.pedir = false; renderModal(); }
function closeCard(){ UI.cardId = null; $("#modal").innerHTML = ""; if (UI.pend && !isEditing()) { UI.pend = false; renderMain(); } }
const pastaUrl = k => S.cliente?.pastas?.[k] || "";
const nomeFicheiro = (c, suf) => `TDA_${c.data}_${suf}`;
function linkField(name, label, val, pastaKey, fname, editable){
  const url = pastaKey ? pastaUrl(pastaKey) : ""; const pn = (PASTAS.find(p => p[0]===pastaKey)||[])[1];
  return `<div style="display:grid;gap:4px"><div class="linkrow"><label class="f">${label}<input name="${name}" value="${esc(val)}" placeholder="https://…" ${editable?"":"readonly"} id="fld-${name}"></label>${val ? `<a class="btn" href="${esc(val)}" target="_blank" rel="noopener">Abrir</a>` : `<span></span>`}</div>
    ${pastaKey ? `<p class="hint">Pasta: ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(pn)}</a>` : `${esc(pn)}`} · nome do ficheiro <code>${esc(fname)}</code></p>` : ""}</div>`;
}
function renderModal(){
  const c = S.cartoes.find(x => x.id === UI.cardId); if (!c) { closeCard(); return; }
  const p = papel(); const eCopy = p === "dona"; const eLinks = p !== "cliente"; const feed = c.tipo === "Feed";
  const ta = (name, label, val, cls, h) => eCopy ? `<label class="f">${label}<textarea name="${name}" class="${cls||""}" id="fld-${name}" ${h?`style="min-height:${h}px"`:""}>${esc(val)}</textarea></label>`
    : (val ? `<div style="display:grid;gap:2px"><span class="lbl">${label}</span><p class="readv${cls==="cap"?" hand":""}" style="${cls==="cap"?"font-size:17px":""}">${esc(val)}</p></div>` : "");
  const res = S.resultados.find(r => r.id === c.id) || {};
  const resFields = (pref, obj) => `<div class="fgrid">${METRICAS_POST.map(([k,l]) => `<label class="f">${l}<input type="number" min="0" name="${pref}${k}" value="${obj?.[k] ?? ""}" id="fld-${pref}${k}"></label>`).join("")}</div>`;

function barChart(title, rows, key){
  const vals = rows.map(r => r[key] == null ? null : Number(r[key]));
  if (!vals.some(v => v != null)) return `<div class="chart"><h3>${title}</h3><p class="small muted">Sem dados ainda.</p></div>`;
  const W = 300, H = 150, pl = 8, pb = 22, pt = 18, max = Math.max(1, ...vals.filter(v => v != null)), bw = (W - pl*2) / rows.length;
  const bars = rows.map((r,i) => { const v = vals[i], x = pl + i*bw + bw*.2, w = bw*.6, h = v == null ? 0 : Math.max(2, v/max*(H-pb-pt)), y = H-pb-h;
    return `${v != null ? `<rect class="b" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"><title>${esc(fmtCurto(r.inicio))}: ${fmtN(v)}</title></rect><text class="val" x="${x+w/2}" y="${y-4}" text-anchor="middle">${fmtN(v)}</text>` : ""}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(fmtCurto(r.inicio))}</text>`; }).join("");
  return `<div class="chart"><h3>${title}</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title} por semana"><line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}"/>${bars}</svg></div>`;
}

  ${o.out.length ? `<div class="card"><div class="spread"><h2>Proposta</h2><div class="row"><button class="btn primary" data-act="enviarTodos">Enviar tudo para o quadro (Ideia)</button><button class="btn" data-act="guardarRasc">Guardar rascunho</button><button class="btn ghost" data-act="descartar">Descartar</button></div></div>
    ${o.out.map((g,gi) => `<h3 class="serif" style="font-size:24px">${esc(g.titulo)}</h3>${g.nota ? `<p class="chip warn" style="white-space:normal">${esc(g.nota)}</p>` : ""}${g.cartoes.map((c,i) => previewCartao(c,gi,i)).join("")}`).join("")}</div>` : ""}
  ${S.rascunhos.length ? `<div class="card"><h3>Rascunhos guardados</h3>${[...S.rascunhos].sort((a,b) => (b.em||"").localeCompare(a.em||"")).map(r => `<div class="spread" style="border-top:1px solid var(--line);padding-top:8px"><span>${esc(fmtQuando(r.em))} · ${esc((r.out||[]).map(g => g.titulo).join(", "))}</span><span class="row"><button class="btn sm" data-act="abrirRasc" data-id="${esc(r.id)}">Abrir</button><button class="btn ghost sm danger" data-act="apagarRasc" data-id="${esc(r.id)}">Apagar</button></span></div>`).join("")}</div>` : ""}`;
}
function previewCartao(c,gi,i){
  const f = (l,v,cls) => v ? `<div style="display:grid;gap:2px"><span class="lbl">${l}</span><p class="readv ${cls||""}" style="${cls?"font-size:17px":""}">${esc(v)}</p></div>` : "";
  return `<div class="sec"><div class="spread"><div><span class="small muted">${esc(c.data ? fmtDia(c.data) : "")}</span><h3>${esc(c.titulo || c.tipo)}${c.formato ? " · " + esc(c.formato) : ""}</h3></div><button class="btn sm" data-act="enviarUm" data-g="${gi}" data-i="${i}">Enviar para o quadro</button></div>
    ${f("Intenção",c.intencao)}${f("Estratégia",c.estrategia)}${f("Tema",c.tema)}${f("Como fazer",c.comoFazer)}${f("Inspiração",c.inspiracao)}${f("Legenda",c.legenda,"hand")}
    ${(c.stories||[]).map((s,j) => `<div class="sec story"><h4>Storie ${j+1} · ${s.media==="foto"?"foto":"vídeo"}</h4>${f("Intenção",s.intencao)}${f("Estratégia",s.estrategia)}${f("Tema",s.tema)}${f("Texto",s.texto,"hand")}${f("Como fazer",s.comoFazer)}</div>`).join("")}</div>`;
}
let genCtl = null;
async function gerar(){
  if (!sample) return; const o = UI.of; const sel = semanasOrd().filter(w => o.semanas.includes(w.id)); if (!sel.length) return;
  const alvo = o.modo === "semana" ? sel : [sel[0]];
  o.busy = true; o.err = ""; o.out = []; genCtl = new AbortController();
  for (let k = 0; k < alvo.length; k++) {
    const w = alvo[k]; o.prog = alvo.length > 1 ? `A gerar ${k+1} de ${alvo.length}… (1 a 2 min cada)` : "A pensar… (1 a 2 minutos)"; renderMain();
    try { const res = await sample.json(promptOficina(w), { signal: genCtl.signal, modelTier:"complex", cache:false });
      if (!res || !Array.isArray(res.cartoes)) throw { code:"invalid_json" };
      o.out.push({ semana:w.id, titulo:`${nomeSemana(w)} · ${w.titulo}`, nota:res.notaParaTania || "", cartoes:res.cartoes });
    } catch(e){ o.err = e?.code === "cancelled" ? "" : e?.code === "not_granted" ? "Não deste permissão para usar o Claude nesta página." : e?.code === "rate_limited" ? "Muitos pedidos seguidos. Espera um minuto." : e?.code === "invalid_json" ? "A resposta veio num formato que não consegui ler. Carrega em Gerar outra vez." : "Não consegui gerar. Tenta outra vez."; break; }
  }
  o.busy = false; o.prog = ""; renderMain();
}
async function enviarParaQuadro(c){
  const data = c.data || UI.of.data || todayIso; const id = `${CLIENTE}-${data}-${uidShort()}`; const w = semanaDe(data); const tipo = c.tipo === "Storie" ? "Storie" : "Feed";
  return write(`cartoes/${id}`, { cliente:CLIENTE, data, semana: w ? w.id : null, tipo, formato: tipo === "Feed" ? (FORMATOS.includes(c.formato) ? c.formato : "Reel") : null,
    titulo:c.titulo||"", intencao:c.intencao||"", estrategia:c.estrategia||"", tema:c.tema||"", comoFazer:c.comoFazer||"", inspiracao:c.inspiracao||"", legenda:c.legenda||"",
    stories:(c.stories||[]).map(s => ({ intencao:s.intencao||"", estrategia:s.estrategia||"", tema:s.tema||"", texto:s.texto||"", comoFazer:s.comoFazer||"", media:s.media==="foto"?"foto":"video", linkCriativo:"", linkDrive:"" })),
    linkCriativo:"", capaCriativo:"", linkDrive:"", capaDrive:"", etapa:"ideia", historico:[{ etapa:"ideia", por:S.me.id, em:new Date().toISOString() }], criadoEm:new Date().toISOString() });
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { UI.tab = tab.dataset.tab; try { localStorage.setItem("td-tab3", UI.tab); } catch(x){} renderChrome(); renderMain(); return; }
  const op = e.target.closest("[data-open]");
  if (op && !e.target.closest("#modal")) { openCard(op.dataset.open); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act; const card = () => S.cartoes.find(x => x.id === UI.cardId);
  switch (a) {
    case "fecharFundo": if (e.target === el) closeCard(); break;
    case "fechar": closeCard(); break;
    case "paraTi": { const pt = paraTi().sort((x,y) => x.data.localeCompare(y.data)); if (pt.length) openCard(pt[0].id); break; }
    case "vista": UI.vista = el.dataset.v; try { localStorage.setItem("td-vista", UI.vista); } catch(x){} renderMain(); break;
    case "abrirSemana": UI.semAberta = el.dataset.id; UI.tab = "semanas"; renderChrome(); renderMain(); break;
    case "verSemana": UI.semana = el.dataset.id; UI.vista = "etapas"; UI.tab = "quadro"; renderChrome(); renderMain(); break;
    case "mes": { const [y,m] = UI.mes.split("-").map(Number); const d = new Date(y, m-1+Number(el.dataset.d), 1); UI.mes = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; renderMain(); break; }
    case "novoCartao": {
      const w = S.semanas.find(x => x.id === el.dataset.sem); if (!w) break;
      const usados = new Set(S.cartoes.filter(c => c.data >= w.inicio && c.data <= w.fim).map(c => c.data));
      let data = w.inicio; for (let i = 0; i < 7; i++) { const d = addDays(w.inicio, i); if (!usados.has(d)) { data = d; break; } }
      const t = [0,2,4,6].includes(dow(data)) ? "Feed" : "Storie"; const id = `${CLIENTE}-${data}-${uidShort()}`;
      const body = { cliente:CLIENTE, data, semana:w.id, tipo:t, formato: t==="Feed"?"Reel":null, titulo:"", intencao:"", estrategia:"", tema:"", comoFazer:"", inspiracao:"", legenda:"", stories: t==="Feed" ? [{media:"video"}] : [{media:"video"},{media:"video"}], linkCriativo:"", capaCriativo:"", linkDrive:"", capaDrive:"", etapa:"ideia", historico:[{etapa:"ideia",por:S.me.id,em:new Date().toISOString()}], criadoEm:new Date().toISOString() };
      if (await write(`cartoes/${id}`, body)) { if (!S.cartoes.find(x => x.id === id)) S.cartoes.push({ id, ...body }); openCard(id); }
      break;
    }
    case "mover": { const c = card(); if (c) await mover(c, el.dataset.to, el.dataset.to === "publicado" ? { publicadoEm:new Date().toISOString() } : undefined); break; }
    case "ok": { const c = card(); if (c) await mover(c, "aprovado", { aprovadoPor:S.me.id, aprovadoEm:new Date().toISOString(), alteracoes:false }); break; }
    case "pedir": UI.pedir = true; renderModalLive(); setTimeout(() => $("#pedirTxt")?.focus(), 30); break;
    case "pedirCancelar": UI.pedir = false; renderModalLive(); break;
    case "pedirEnviar": { const c = card(); const t = $("#pedirTxt")?.value.trim(); if (!t) { toast("Escreve o que tem de mudar."); break; }
      await addComentario({ cartao:c.id, texto:"Alterações: " + t }); UI.pedir = false; await mover(c, "criativo", { alteracoes:true }); break; }
    case "comentar": { const t = $("#novoCom")?.value.trim(); if (!t) break; if (await addComentario({ cartao:UI.cardId, texto:t })) $("#novoCom").value = ""; break; }
    case "addStory": { const c = card(); const body = lerForm(c); body.stories = [...body.stories, { media:"video" }]; if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); renderModal(); } break; }
    case "rmStory": { const c = card(); const body = lerForm(c); body.stories.splice(Number(el.dataset.i),1); if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); renderModal(); } break; }
    case "askDel": $("#delZone").innerHTML = `<span class="row small">Apagar mesmo? <button type="button" class="btn danger" data-act="del">Sim</button><button type="button" class="btn" data-act="noDel">Não</button></span>`; break;
    case "noDel": $("#delZone").innerHTML = `<button type="button" class="btn ghost danger" data-act="askDel">Apagar cartão</button>`; break;
    case "del": { try { await db.doc(`cartoes/${UI.cardId}`).delete(); toast("Apagado."); } catch(x){ toast("Não apagou."); } closeCard(); break; }
    case "editSem": UI.editSem = el.dataset.id; renderMain(); break;
    case "cancelSem": UI.editSem = null; renderMain(); break;
    case "novaSemana": { const last = semanasOrd().slice(-1)[0]; const ini = last ? addDays(last.fim,1) : mondayOf(todayIso); const id = `${CLIENTE}-${ini}`;
      if (await write(`semanas/${id}`, { cliente:CLIENTE, inicio:ini, fim:addDays(ini,6), titulo:"Nova semana", objetivo:"", oferta:"", palavraChave:"", estrategiaStories:"", estrategiaFeed:"", notas:"" })) { UI.semAberta = id; UI.editSem = id; UI.tab = "semanas"; renderChrome(); renderMain(); } break; }
    case "addInsp": { const u = $("#inspUrl")?.value.trim(); if (!/^https?:\/\//.test(u||"")) { toast("Cola um link que comece por https://"); break; }
      if (await write(`inspiracoes/${CLIENTE}-${uidShort()}`, { cliente:CLIENTE, semana:UI.semAberta, url:u, nota:$("#inspNota").value.trim(), autor:S.me.id, em:new Date().toISOString() })) { $("#inspUrl").value = ""; $("#inspNota").value = ""; } break; }
    case "rmInsp": { try { await db.doc(`inspiracoes/${el.dataset.id}`).delete(); } catch(x){ toast("Não apagou."); } break; }
    case "comSemana": { const t = $("#semCom")?.value.trim(); if (!t) break; if (await addComentario({ semana:UI.semAberta, texto:t })) $("#semCom").value = ""; break; }
    case "editEst": UI.editEst = true; renderMain(); break;
    case "cancelEst": UI.editEst = false; renderMain(); break;
    case "savePessoa": { const id = el.dataset.id; if (await write(`pessoas/${id}`, { nome: $(`#pn-${CSS.escape(id)}`).value.trim(), papel: $(`#pp-${CSS.escape(id)}`).value }, true)) toast("Guardado."); break; }
    case "editDados": UI.editDados = el.dataset.id; renderMain(); break;
    case "cancelDados": UI.editDados = null; renderMain(); break;
    case "saveDados": { const tr = el.closest("tr"); const prev = { ...(S.metricas.find(m => m.id === el.dataset.id) || {}) }; delete prev.id;
      const body = { ...prev, inicio:el.dataset.ini, fim:el.dataset.fim, fonte: prev.fonte || "manual", atualizadoEm:new Date().toISOString() };
      tr.querySelectorAll("input[data-k]").forEach(i => { body[i.dataset.k] = i.value === "" ? null : Number(i.value); });
      if (await write(`${PRIV}/metricas/${el.dataset.id}`, body)) { UI.editDados = null; toast("Guardado."); renderMain(); } break; }
    case "perguntar": UI.qaTxt = $("#qaTxt")?.value || UI.qaTxt; perguntar(); break;
    case "editMelh": UI.editMelh = el.dataset.id; renderMain(); break;
    case "cancelMelh": UI.editMelh = null; renderMain(); break;
    case "addMelh": case "rmMelh": { const i = S.relatorios.findIndex(x => x.id === UI.editMelh); const cur = lerMelhorias();
      if (a === "addMelh") cur.push({ acao:"", porque:"", como:"", autor:"tania" }); else cur.splice(Number(el.dataset.i),1);
      S.relatorios[i] = { ...S.relatorios[i], melhorias:cur }; renderMain(); break; }
    case "saveMelh": { const cur = lerMelhorias().filter(m => m.acao.trim()); if (await write(`relatorios/${el.dataset.id}`, { melhorias:cur }, true)) { UI.editMelh = null; toast("Melhorias guardadas."); renderMain(); } break; }
    case "ofModo": UI.of.modo = el.dataset.v; if (UI.of.modo === "dia") UI.of.semanas = UI.of.semanas.slice(0,1); renderMain(); break;
    case "ofSem": { const id = el.dataset.id; const s = UI.of.semanas;
      if (UI.of.modo === "dia") UI.of.semanas = [id]; else UI.of.semanas = s.includes(id) ? s.filter(x => x !== id) : [...s, id]; renderMain(); break; }
    case "gerar": gerar(); break;
    case "parar": genCtl?.abort(); break;
    case "descartar": UI.of.out = []; renderMain(); break;
    case "enviarUm": { const g = UI.of.out[Number(el.dataset.g)]; const i = Number(el.dataset.i); if (await enviarParaQuadro(g.cartoes[i])) { g.cartoes.splice(i,1); if (!g.cartoes.length) UI.of.out.splice(Number(el.dataset.g),1); toast("Enviado para Ideia."); renderMain(); } break; }
    case "enviarTodos": { let n = 0; for (const g of UI.of.out) for (const c of g.cartoes) if (await enviarParaQuadro(c)) n++; UI.of.out = []; toast(`${n} cartões enviados para Ideia.`); renderMain(); break; }
    case "guardarRasc": { if (await write(`data/users/${S.me.id}/r-${uidShort()}`, { em:new Date().toISOString(), brief:UI.of.brief, semanas:UI.of.semanas, out:UI.of.out })) toast("Rascunho guardado."); break; }
    case "abrirRasc": { const r = S.rascunhos.find(x => x.id === el.dataset.id); if (r) { UI.of.out = r.out || []; UI.of.brief = r.brief || ""; if (r.semanas) UI.of.semanas = r.semanas; renderMain(); } break; }
    case "apagarRasc": { try { await db.doc(`data/users/${S.me.id}/${el.dataset.id}`).delete(); } catch(x){} break; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.matches("[data-act=semSel]")) { UI.semana = t.value; renderMain(); }
  else if (t.matches("[data-act=semAbrir]")) { UI.semAberta = t.value; UI.editSem = null; t.blur(); renderMain(); }
  else if (t.matches("[data-act=relSel]")) { UI.relId = t.value; t.blur(); renderMain(); }
  else if (t.matches("[data-act=moverSel]")) { const c = S.cartoes.find(x => x.id === UI.cardId); if (c && t.value !== c.etapa) await mover(c, t.value); }
  else if (t.matches("[data-of]")) { UI.of[t.dataset.of] = t.value; if (t.tagName === "SELECT") { t.blur(); renderMain(); } }
});
document.addEventListener("input", e => { const t = e.target; if (t.matches("[data-of]")) UI.of[t.dataset.of] = t.value; if (t.matches("[data-qa]")) UI.qaTxt = t.value; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.cardId) closeCard(); });

document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "cardForm") { const c = S.cartoes.find(x => x.id === UI.cardId); const body = lerForm(c); if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); toast("Guardado."); renderModal(); } return; }
  if (f.id === "resForm") {
    const c = S.cartoes.find(x => x.id === UI.cardId); const fd = new FormData(f); const num = k => { const v = fd.get(k); return v === "" || v == null ? null : Number(v); };
    const body = { atualizadoEm:new Date().toISOString(), stories:(c.stories||[]).map((s,i) => Object.fromEntries(METRICAS_POST.map(([k]) => [k, num(`s${i}_${k}`)]))) };
    if (c.tipo === "Feed") { body.feed = Object.fromEntries(METRICAS_POST.map(([k]) => [k, num(`f_${k}`)])); body.linkPost = fd.get("linkPost") || ""; }
    if (await write(`${PRIV}/resultados/${c.id}`, body)) toast("Resultados guardados.");
    return;
  }
  const fd = new FormData(f);
  if (f.dataset.form === "semana") {
    const cur = { ...(S.semanas.find(x => x.id === f.dataset.id) || {}) }; delete cur.id;
    ["inicio","fim","palavraChave","titulo","objetivo","oferta","estrategiaStories","estrategiaFeed"].forEach(k => { if (fd.has(k)) cur[k] = fd.get(k); });
    const n = Number(fd.get("numero")); cur.numero = n > 0 ? n : null;
    if (await write(`semanas/${f.dataset.id}`, cur)) { UI.editSem = null; toast("Guardado."); renderMain(); }
  } else if (f.dataset.form === "estrategia") {
    const cur = { ...(S.priv || {}) };
    ["objetivo","diagnostico","ritmo","tom"].forEach(k => cur[k] = fd.get(k));
    cur.regras = String(fd.get("regras")||"").split("\n").map(s => s.trim()).filter(Boolean);
    cur.metas = { ...(cur.metas||{}) }; ["cliquesLink","dms","vendasOnline","alcance"].forEach(k => { const v = fd.get("meta_"+k); cur.metas[k] = v === "" ? null : Number(v); });
    const pastas = {}; PASTAS.forEach(([k]) => { pastas[k] = fd.get("pasta_"+k) || ""; });
    const pub = { ...(S.cliente||{}), pastas };
    const ok1 = await write(PRIV, cur); const ok2 = await write(`clientes/${CLIENTE}`, pub);
    if (ok1 && ok2) { UI.editEst = false; toast("Guardado."); renderMain(); }
  }
});

/* drag & drop na vista por etapa (só a estratega) */
let dragId = null;
document.addEventListener("dragstart", e => { const t = e.target.closest(".tile[draggable]"); if (t) { dragId = t.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", e => { const col = e.target.closest("[data-col]"); if (col && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("drop", async e => { const col = e.target.closest("[data-col]"); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); if (col && dragId) { e.preventDefault(); const c = S.cartoes.find(x => x.id === dragId); dragId = null; if (c && c.etapa !== col.dataset.col) await mover(c, col.dataset.col); } });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });

renderChrome(); renderMain();
</script>
