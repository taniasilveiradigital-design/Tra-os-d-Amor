<style>

}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1816; --surface:#26201D; --sunk:#2F2825; --ink:#F1E8E4; --muted:#B5A49D; --line:#3D3330;
  --terra:#E3A58D; --terra-soft:#4A3129;
  --ok:#8FD4A6; --ok-bg:#1F3527; --warn:#F2C77A; --warn-bg:#3A2E16; --bad:#F2A596; --bad-bg:#43241F;
  --mk-reels:#E3A58D; --mk-stories:#A9C3A5; --mk-estaticos:#A7BDDB; --mk-ig:#CF7C5F; --mk-fb:#5E8FD3;
  --cover:#5E4333; --cover-light:#3A302B; --cover-light-ink:#EADBD0;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Karla,system-ui,sans-serif;padding-inline:16px;padding-block:20px 60px}
.app{max-width:1440px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--terra)}
.hand{font-family:"Patrick Hand",Karla,cursive}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic}
.muted{color:var(--muted)} .small{font-size:13px}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:grid;gap:2px}
.brand .eyebrow{font-family:"Patrick Hand",Karla,cursive;font-size:19px;color:var(--terra)}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;border:0}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
button.chip{cursor:pointer}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}

nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--terra)}
nav.tabs button.priv{color:var(--terra)}
nav.tabs .sep{width:1px;background:var(--line);margin:8px 6px;flex:none}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
.panel{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--terra)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:var(--bg)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
label.f{display:grid;gap:4px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
label.f input,label.f select,label.f textarea,.inp{font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.et{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.et-ideia{background:var(--e-ideia);color:var(--e-ideia-ink)} .et-copy{background:var(--e-copy);color:var(--e-copy-ink)}
.et-criativo{background:var(--e-criativo);color:var(--e-criativo-ink)} .et-revisao{background:var(--e-revisao);color:var(--e-revisao-ink)}

.et-aprovado{background:var(--e-aprovado);color:var(--e-aprovado-ink)} .et-publicado{background:var(--e-publicado);color:var(--e-publicado-ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:272px;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;background:var(--sunk);min-height:120px}
.col.ideia{background:var(--e-ideia)} .col.copy{background:var(--e-copy)} .col.criativo{background:var(--e-criativo)} .col.revisao{background:var(--e-revisao)}
.col.cliente{background:var(--e-cliente)} .col.drive{background:var(--e-drive)} .col.aprovado{background:var(--e-aprovado)} .col.publicado{background:var(--e-publicado)}

.colhd{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;padding:2px 4px}
.colhd .n{font-size:12px;opacity:.75}
.cover{position:relative;overflow:hidden;border-radius:10px;border:0;cursor:pointer;text-align:left;padding:0;display:grid;width:100%;background:var(--cover);color:var(--cover-ink)}
.cover .art{height:128px;display:grid;place-items:center;position:relative}
.cover .art::before{content:attr(data-mark);position:absolute;left:10px;top:-18px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:150px;line-height:1;opacity:.14}
.cover .art span{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:32px;position:relative}
.cover .foot{background:var(--surface);color:var(--ink);padding:10px 12px;font-size:14px;display:grid;gap:2px}
.cover.light{background:var(--cover-light);color:var(--cover-light-ink)}
.cover.light .art span{font-size:27px;text-align:center;padding:0 10px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--terra)}
.tile[draggable="true"]{cursor:grab}
.tile .t{font-weight:700;font-size:14px}
.tile .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.tile.s-ideia{border-left-color:var(--e-ideia-ink)} .tile.s-copy{border-left-color:var(--e-copy-ink)} .tile.s-criativo{border-left-color:var(--e-criativo-ink)} .tile.s-revisao{border-left-color:var(--e-revisao-ink)}
.tile.s-cliente{border-left-color:var(--e-cliente-ink)} .tile.s-drive{border-left-color:var(--e-drive-ink)} .tile.s-aprovado{border-left-color:var(--e-aprovado-ink)} .tile.s-publicado{border-left-color:var(--e-publicado-ink)}
.wkgrp{display:grid;gap:8px}
.wkgrp-hd{font-size:12px;padding:6px 4px 0;border-top:1px solid rgba(0,0,0,.08);color:var(--ink)}
.wkgrp:first-of-type .wkgrp-hd{border-top:0;padding-top:0}
.wkgrp-hd b{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:17px;font-weight:500}
.wkgrp-hd span{opacity:.75}
.wklink{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;font-size:14px;width:100%}
.addcard{background:transparent;border:0;text-align:left;padding:6px 4px;cursor:pointer;color:var(--muted);font-weight:700}
.addcard:hover{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px;display:grid;align-content:start;gap:4px}
.day.out{background:transparent;border-style:dashed;opacity:.55}
.day .dn{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;display:flex;justify-content:space-between}
.day .et{display:block;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:0;text-align:left;width:100%}
.wkband{grid-column:1/-1;font-size:12px;color:var(--muted);padding:6px 4px 0}
.wkband b{color:var(--terra);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:18px;font-weight:500}
.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(760px,100%);height:100%;overflow:auto;padding:20px 20px calc(40px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.sec.story{border-left:4px solid var(--e-criativo-ink)}
.sec.priv{border:1px dashed var(--terra)}
.checks{display:grid;gap:4px;font-size:14px}
.checks div,.checks .chk{display:flex;gap:8px;align-items:baseline}
.checks .chk{background:none;border:0;padding:3px 0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px} .checks .chk:hover{background:var(--sunk)}
.checks .y{color:var(--ok);font-weight:700} .checks .x{color:var(--muted)}
.linkrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:end}
.hint{font-size:12px;color:var(--muted)}
.hint code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:12px}
.actions{display:grid;gap:10px;background:var(--surface);border:1px solid var(--terra);border-radius:12px;padding:14px}
.coms{display:grid;gap:10px}
.com{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.com.sys{background:transparent;border-style:dashed}
.com .who{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.com .when{font-size:12px;color:var(--muted);font-weight:400}
.role{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.role.dona{background:var(--terra-soft);color:var(--terra)} .role.cliente{background:var(--e-cliente);color:var(--e-cliente-ink)} .role.equipa{background:var(--e-criativo);color:var(--e-criativo-ink)}
.readv{white-space:pre-line}
.wkhero{border-radius:14px;overflow:hidden;background:var(--cover);color:var(--cover-ink);padding:22px 20px;display:grid;gap:4px;position:relative}
.wkhero::before{content:"T";position:absolute;right:20px;top:-30px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:170px;opacity:.12;line-height:1}
.wkhero h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:38px}
.wkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start;border-top:4px solid var(--td-castanho)}
.box.b-obj{border-top-color:var(--td-terra)} .box.b-of{border-top-color:var(--td-castanho)} .box.b-feed{border-top-color:var(--td-azul)} .box.b-st{border-top-color:var(--td-salvia)}
.insp{display:grid;gap:8px}
.insp a.il{display:grid;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink);background:var(--bg);min-width:0}
.insp a.il:hover{border-color:var(--terra)}
.insp .u{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.n input{width:90px;text-align:right;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;border-top:4px solid var(--td-castanho)}
.kpi:nth-child(4n+1){border-top-color:var(--td-terra)} .kpi:nth-child(4n+2){border-top-color:var(--td-salvia)} .kpi:nth-child(4n+3){border-top-color:var(--td-azul)}
.kpi .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px Karla,system-ui,sans-serif}
.chart .val{fill:var(--ink);font-weight:700}
.chart rect.b{fill:var(--terra)}
.chart rect.ig{fill:var(--mk-ig)} .chart rect.fb{fill:var(--mk-fb)} .chart rect.ant{opacity:.45}
.chart g.hit:hover rect{stroke:var(--ink);stroke-width:1.5}
.charts.big{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.chart.big h3{font-size:17px} .chart.big text{font-size:13px} .chart.big .val{font-size:14px}
.fgrp{display:grid;gap:12px} .fg{display:grid;gap:4px} .fgl{font-weight:700;font-size:14px}
.chart.big .hbar{grid-template-columns:76px 1fr 56px} .chart.big .hbar .tr{height:16px} .chart.big .hbar .v{font-size:15px;text-align:right}
.kpi.rede{gap:6px} .kpi .kr{display:grid;grid-template-columns:10px 1fr auto auto;gap:6px;align-items:center;font-size:14px} .kpi .kr i,i.dot{display:inline-block;width:10px;height:10px;border-radius:3px} i.dot{margin-right:5px;vertical-align:-1px}
.kpi .kr b{font-variant-numeric:tabular-nums}
.share{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden} .share span{display:block;height:100%}
table.mini{width:100%;border-collapse:collapse;font-size:14px} table.mini td,table.mini th{padding:3px 0;border-bottom:1px solid var(--line)} table.mini .n{text-align:right;padding-left:10px}
.card.leitura{border-left:5px solid var(--mk-fb)}
.chart.wide{grid-column:1/-1} .chart polyline.ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round} .chart polyline.ig{stroke:var(--mk-ig)} .chart polyline.fb{stroke:var(--mk-fb)}
.chart circle.pt{stroke:var(--surface);stroke-width:2} .chart circle.ig{fill:var(--mk-ig)} .chart circle.fb{fill:var(--mk-fb)} .chart g.hit:hover circle.pt{r:6}
.relbar{border-top:4px solid var(--td-terra)}
.exemplo.sim{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:44px;z-index:5}
.funil{display:grid;gap:10px;align-content:start} .funil h4{display:flex;align-items:center;gap:4px}
.fstep{display:grid;gap:3px} .fstep .tr,.meta .tr{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;display:block} .fstep .tr span,.meta .tr span{display:block;height:100%;border-radius:6px}
.meta{display:grid;gap:3px;min-width:120px} table.cmp tr.top td{background:var(--terra-soft)}
.aval{border-top:5px solid var(--td-castanho);gap:14px}
.nota{display:flex;align-items:center;gap:8px;min-width:150px} .nota .tr{flex:1;height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;display:block} .nota .tr span{display:block;height:100%;background:var(--td-terra);border-radius:5px}

<div class="app">

      <p class="eyebrow">Estúdio de conteúdos</p>
      <h1 id="clientName">Traços D'Amor</h1>
      <p class="muted small" id="clientMeta">A carregar…</p>
    </div>

  </header>

</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
const CLIENTE = "tracosdamor";
const PRIV = `privado/${CLIENTE}`;
const ETAPAS = [["ideia","Ideia"],["criativo","Criativo"],["revisao","Revisão estratégica"],["cliente","Aprovação cliente"],["aprovado","Aprovado"],["publicado","Publicado"]];
const ETQ = Object.fromEntries(ETAPAS);
const normEtapa = e => e === "copy" ? "ideia" : e === "drive" ? "aprovado" : e;
const IDX = Object.fromEntries(ETAPAS.map(([k],i)=>[k,i]));
const FORMATOS = ["Reel","Carrossel","Estático"];
const PASTAS = [["reels","Vídeos Reels"],["capas","Capas Reels"],["storyVideo","Vídeos Story"],["storyFoto","Fotos Story"],["feedFoto","Estáticos / Carrosséis"]];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const DIAS = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const DIAS_L = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
const REDES = [["instagram","Instagram","ig"],["facebook","Facebook","fb"]];
const METRICAS_REDE = [["seguidores","Seguidores"],["novosSeguidores","Novos seguidores"],["alcance","Alcance"],["visualizacoes","Visualizações"],["interacoes","Interações"],["visitasPerfil","Visitas ao perfil / página"],["cliquesLink","Cliques no link"],["mensagens","Mensagens / DMs de venda"]];
const METRICAS_NEG = [["vendasOnline","Vendas online"],["receita","Receita (€)"]];
/* métricas semanais: { instagram:{…}, facebook:{…}, vendasOnline, receita }. Documentos antigos tinham as chaves do Instagram soltas. */
function redeSem(m, rede){
  if (!m) return {};
  if (m[rede]) return m[rede];
  if (rede !== "instagram") return {};
  const o = {}; METRICAS_REDE.forEach(([k]) => { if (m[k] != null) o[k] = m[k]; }); if (o.mensagens == null && m.dms != null) o.mensagens = m.dms; return o;
}
const somaRedes = (m, k) => { const a = redeSem(m,"instagram")[k], b = redeSem(m,"facebook")[k]; return a == null && b == null ? null : (Number(a)||0) + (Number(b)||0); };
function delta(a, b){
  if (a == null || b == null || a === "" || b === "") return `<span class="dl eq">—</span>`;
  a = Number(a); b = Number(b);
  if (b === 0) return a === 0 ? `<span class="dl eq">=</span>` : `<span class="dl up">▲ novo</span>`;
  const pc = Math.round((a - b) / b * 100);
  return pc > 0 ? `<span class="dl up">▲ +${pc}%</span>` : pc < 0 ? `<span class="dl down">▼ ${pc}%</span>` : `<span class="dl eq">= 0%</span>`;
}
const METRICAS_POST = [["alcance","Alcance"],["visualizacoes","Visualizações"],["gostos","Gostos"],["comentarios","Comentários"],["partilhas","Partilhas"],["guardados","Guardados"],["cliques","Cliques no link"],["respostas","Respostas / DMs"]];
const PAPEL_TXT = { dona:"Estratega", equipa:"Equipa criativa", cliente:"Cliente" };

let db = null, userCap = null, sample = null, mcp = null;
const APP_URL = "https://claude.ai/artifact/D3MiggwcKrr8yggsoKk3vz";
const S = { estado:{ lidas:[] }, sugestoes:[], cliente:null, priv:null, semanas:[], cartoes:[], comentarios:[], inspiracoes:[], pessoas:[], metricas:[], resultados:[], perguntas:[], relatorios:[], relPriv:[], avaliacoes:[], rascunhos:[], loaded:{}, me:{ id:null, isOwner:false }, names:{} };
const UI = { menc:[], notif:false, sugId:null, tab:"quadro", vista:"semanas", semana:"todas", semAberta:null, mes:"2026-10", cardId:null, pend:false, editSem:null, editEst:false, editDados:null, relId:null, editMelh:null, qaBusy:false, qaTxt:"",
  of:{ modo:"semana", semanas:[], data:"", tipo:"Feed", formato:"Reel", brief:"", busy:false, prog:"", out:[], err:"", ret:null, retTxt:{}, rascId:null, insp:"", confSub:false } };
try { if (!localStorage.getItem("td-ajuda-vista")) UI.ajuda = true; } catch(e){}
try { const t = localStorage.getItem("td-tab3"); if (t) UI.tab = t; const v = localStorage.getItem("td-vista"); if (v) UI.vista = v; } catch(e){}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const mondayOf = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const dow = s => (parse(s).getDay()+6)%7;
const fmtCurto = s => { if (!s) return ""; const d = parse(s); return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`; };
const fmtLongo = s => { const d = parse(s); return `${pad(d.getDate())} de ${MESES[d.getMonth()]}`; };
const fmtDia = s => { const d = parse(s); return `${DIAS_L[dow(s)]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fmtN = v => v == null || v === "" || isNaN(v) ? "—" : Number(v).toLocaleString("pt-PT");
const fmtQuando = t => { try { const d = new Date(t); return d.toLocaleDateString("pt-PT",{day:"numeric",month:"short"}) + " " + d.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"}); } catch(e){ return ""; } };
const todayIso = iso(new Date());
const uidShort = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const semanasOrd = () => [...S.semanas].sort((a,b) => a.inicio.localeCompare(b.inicio));
const semanaDe = d => S.semanas.find(w => w.inicio <= d && d <= w.fim);
const mesDe = w => w.inicio.slice(0,7);
const numSemana = w => w.numero || (semanasOrd().filter(x => mesDe(x) === mesDe(w) && x.inicio <= w.inicio).length);
const nomeSemana = w => `Semana ${numSemana(w)}`;
const semanaAtual = () => { const ws = semanasOrd(); return ws.find(w => w.fim >= todayIso) || ws[ws.length-1]; };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>{ t.hidden = true; }, 2800); }

/* ---------- pessoas ---------- */
function papel(){ if (S.me.isOwner) return "dona"; const p = S.pessoas.find(x => x.id === S.me.id); return p?.papel === "equipa" ? "equipa" : "cliente"; }
const isDona = () => papel() === "dona";
function papelDe(id){ const p = S.pessoas.find(x => x.id === id); return p?.papel || (id === S.me.id ? papel() : "cliente"); }
function nomeDe(id){ const p = S.pessoas.find(x => x.id === id); return p?.nome || S.names[id] || (id === S.me.id ? "Tu" : PAPEL_TXT[papelDe(id)] || "Alguém"); }
function quem(id){ const pp = papelDe(id); return `${esc(nomeDe(id))} <span class="role ${pp}">${esc(PAPEL_TXT[pp]||"")}</span>`; }
function visivel(c){ return papel() !== "cliente" || IDX[c.etapa] >= IDX.cliente; }

/* ---------- db ---------- */
function localMerge(id, body){ const i = S.cartoes.findIndex(x => x.id === id); if (i >= 0) S.cartoes[i] = { ...S.cartoes[i], ...body }; }
async function write(path, data, merge){
  if (!db) { toast("Sem ligação à base de dados."); return false; }
  if (UI.sim && path.startsWith(PRIV)) { toast("Estás na simulação: nada é gravado. Sai da simulação para mexer nos dados reais."); return false; }
  try { const r = db.doc(path); if (merge) await r.update(data); else await r.set(data); return true; }
  catch(e){ toast(e && e.code === "invalid_argument" ? "Não tens permissão para isto." : "Não gravou. Tenta outra vez."); return false; }
}
function sub(name, q){ q.onSnapshot(snap => { S[name] = snap.docs.map(d => { const o = { id:d.id, ...d.data() }; if (name === "cartoes") o.etapa = normEtapa(o.etapa); return o; }); S.loaded[name] = true; onData(name); }, () => { S.loaded[name] = true; onData(name); }); }
function isEditing(){ const a = document.activeElement; return UI.editSem || UI.editEst || UI.editDados || UI.editRel || (a && $("#main").contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
function onData(name){
  if (["comentarios","pessoas","inspiracoes"].includes(name)) resolveNames();
  renderChrome();
  if (UI.cardId) renderModalLive();
  if (isEditing()) { UI.pend = true; return; }
  renderMain();
}
document.addEventListener("focusout", () => setTimeout(() => { if (UI.pend && !isEditing()) { UI.pend = false; renderMain(); } }, 60));
async function resolveNames(){
  if (!userCap) return;
  const ids = [...new Set([...S.comentarios.map(c => c.autor), ...S.inspiracoes.map(c => c.autor), ...S.pessoas.map(p => p.id)].filter(Boolean))].filter(id => !(id in S.names));
  if (!ids.length) return;
  ids.forEach(id => { S.names[id] = ""; });
  try { const ps = await userCap.profiles(ids); ids.forEach(id => { S.names[id] = ps[id]?.name || ""; }); renderMainSafe(); if (UI.cardId) renderModalLive(); } catch(e){}
}
function renderMainSafe(){ if (isEditing()) { UI.pend = true; } else renderMain(); }

(async () => {
  db = await window.claude?.use?.("db") ?? null;
  if (!db) { S.nodb = true; renderChrome(); renderMain(); return; }
  userCap = await window.claude?.use?.("user") ?? null;
  if (userCap) { const me = await userCap.me(); S.me = { id: me.id, isOwner: me.isOwner }; if (me.id && me.name) S.names[me.id] = me.name; }
  db.doc(`clientes/${CLIENTE}`).onSnapshot(s => { S.cliente = s.exists ? s.data() : null; onData("cliente"); }, () => {});
  for (const c of ["semanas","cartoes","comentarios","inspiracoes","pessoas","relatorios"]) sub(c, db.collection(c).where("cliente","==",CLIENTE));
  if (S.me.isOwner) {
    db.doc(PRIV).onSnapshot(s => { S.priv = s.exists ? s.data() : null; onData("priv"); }, () => {});
    sub("metricas", db.collection(`${PRIV}/metricas`));
    sub("resultados", db.collection(`${PRIV}/resultados`));
    sub("perguntas", db.collection(`${PRIV}/perguntas`));
    sub("sugestoes", db.collection(`${PRIV}/sugestoes`));
    sub("relPriv", db.collection(`${PRIV}/relatorios`));
    sub("avaliacoes", db.collection(`${PRIV}/avaliacoes`));
    if (S.me.id) sub("rascunhos", db.collection(`data/users/${S.me.id}`));
    sample = await window.claude?.use?.("sample") ?? null;
    mcp = await window.claude?.use?.("mcp") ?? null;
  }
  if (S.me.id) db.doc(`data/users/${S.me.id}/estado`).onSnapshot(s => { S.estado = s.exists ? s.data() : { lidas:[] }; onData("estado"); }, () => {});
  if (S.me.id) {
    try { const s = await db.doc(`pessoas/${S.me.id}`).get();
      if (!s.exists) await db.doc(`pessoas/${S.me.id}`).set({ cliente:CLIENTE, papel: S.me.isOwner ? "dona" : null, nome: S.me.isOwner ? "Tânia" : "", desde:new Date().toISOString() });
    } catch(e){}
  }
  renderChrome(); renderMain();
})();

/* ---------- chrome ---------- */
function paraTi(){ const p = papel(); if (p === "equipa") return S.cartoes.filter(c => c.etapa === "criativo" || (c.etapa === "aprovado" && faltaDrive(c).length)); const alvo = p === "dona" ? ["revisao"] : ["cliente"]; return S.cartoes.filter(c => alvo.includes(c.etapa)); }
const avaliado = c => { const r = S.resultados.find(x => x.id === c.id); return !!r && [r.feed, r.feedFb, ...(r.stories||[]), ...(r.storiesFb||[])].some(m => m && Object.values(m).some(v => v != null)); };
function notificacoes(){
  const me = S.me.id; if (!me) return [];
  const lidas = new Set(S.estado?.lidas || []); const out = [];
  for (const c of S.comentarios) {
    if (c.autor !== me && (c.mencoes||[]).includes(me) && !lidas.has(c.id)) out.push({ key:c.id, tipo:"mencao", c });
    if (c.autor === me) for (const o of (c.oks||[])) if (o !== me && !lidas.has(`ok:${c.id}:${o}`)) out.push({ key:`ok:${c.id}:${o}`, tipo:"ok", c, por:o });
  }
  return out.sort((a,b) => (b.c.em||"").localeCompare(a.c.em||""));
}
async function marcarLidas(keys){
  if (!S.me.id || !keys.length) return;
  const lidas = [...new Set([...(S.estado?.lidas || []), ...keys])].slice(-600);
  S.estado = { ...(S.estado||{}), lidas };
  try { await db.doc(`data/users/${S.me.id}/estado`).set({ lidas }); } catch(e){}
  renderChrome();
}
function notifHtml(){
  if (!UI.notif) return "";
  const ns = notificacoes();
  return `<div class="card" style="border-left:4px solid var(--terra)"><div class="spread"><h3>Notificações</h3><div class="row">${ns.length ? `<button class="btn sm" data-act="lerTodas">Marcar todas como lidas</button>` : ""}<button class="btn sm" data-act="notif">Fechar</button></div></div>
    <div class="notif">${ns.length ? ns.map(n => { const card = S.cartoes.find(x => x.id === n.c.cartao);
      return `<button class="n" data-act="abrirNotif" data-key="${esc(n.key)}" data-card="${esc(n.c.cartao||"")}"><span class="small"><b>${n.tipo === "ok" ? `${esc(nomeDe(n.por))} deu OK` : `${esc(nomeDe(n.c.autor))} identificou-te`}</b> · ${esc(fmtQuando(n.c.em))}</span><span class="small muted">${card ? esc(fmtCurto(card.data) + " · " + tituloCartao(card)) : ""}</span><span>${esc((n.c.texto||"").slice(0,140))}</span></button>`; }).join("") : `<p class="muted small">Sem notificações novas.</p>`}</div></div>`;
}
function renderChrome(){
  const c = S.cliente;
  if (c) { $("#clientName").textContent = c.nome || "Traços D'Amor"; $("#clientMeta").textContent = [c.instagram, c.site].filter(Boolean).join(" · "); }
  const p = papel(); const pt = paraTi();
  const nn = notificacoes().length;
  $("#statusChips").innerHTML = `<button class="chip ${nn ? "bad" : "neutral"}" data-act="notif" aria-expanded="${!!UI.notif}">🔔 ${nn}</button><button class="chip neutral" data-act="ajuda" aria-expanded="${!!UI.ajuda}">? Como funciona</button><span class="chip neutral">${esc(PAPEL_TXT[p])}</span>` +

function checklist(c){
  const items = []; const feed = c.tipo === "Feed";
  if (feed) {
    items.push(["Copy para Design", !!(c.tema && c.comoFazer)]);
    if (c.formato === "Reel") items.push(["Capa Canva Reels", !!c.capaCriativo], ["Capa Final (Drive)", !!c.capaDrive]);
    items.push([c.formato === "Reel" ? "Link Canva Reels" : "Link Canva", !!c.linkCriativo], [c.formato === "Reel" ? "Link final Reels (Drive)" : "Link final (Drive)", !!c.linkDrive], ["Legenda", !!c.legenda]);
  }
  (c.stories||[]).forEach((s,i) => { const n = c.stories.length > 1 ? ` ${i+1}` : ""; items.push([`Copy para Storie${n}`, !!(s.texto || s.tema)], [`Link Canva storie${n}`, !!s.linkCriativo], [`Link Storie Final (Drive)${n}`, !!s.linkDrive]); });
  return items.map(([n,ok]) => [n, typeof c.checks?.[n] === "boolean" ? c.checks[n] : ok]);
}
const faltaDrive = c => checklist(c).filter(([n,ok]) => /Drive/.test(n) && !ok).map(x => x[0]);

function porSemana(its, drag){

function renderCal(main){
  const [y,m] = UI.mes.split("-").map(Number);
  const first = `${y}-${pad(m)}-01`; const lastDay = new Date(y, m, 0).getDate();
  const start = mondayOf(first); const end = addDays(mondayOf(`${y}-${pad(m)}-${pad(lastDay)}`), 6);
  const porDia = {}; S.cartoes.filter(visivel).forEach(c => (porDia[c.data] ||= []).push(c));
  let cells = DIAS.map(d => `<div class="wd">${d}</div>`).join("");
  for (let d = start; d <= end; d = addDays(d,1)) {
    if (dow(d) === 0) { const w = S.semanas.find(s => s.inicio === d); if (w) cells += `<div class="wkband"><b>${esc(nomeSemana(w))}</b> · ${esc(w.titulo)}</div>`; }
    const its = (porDia[d]||[]).sort((a,b) => (a.tipo==="Feed"?0:1)-(b.tipo==="Feed"?0:1));
    cells += `<div class="day${d.slice(0,7)!==UI.mes?" out":""}"><span class="dn"><span>${parse(d).getDate()}</span>${d===todayIso?'<span class="chip neutral" style="padding:0 6px">hoje</span>':""}</span>

    <div class="row"><button class="btn" data-act="mes" data-d="-1" aria-label="Mês anterior">‹</button><h2 style="min-width:170px;text-align:center">${cap1(MESES[m-1])} ${y}</h2><button class="btn" data-act="mes" data-d="1" aria-label="Mês seguinte">›</button></div>
    <div class="row small">${ETAPAS.map(([k,l]) => `<span class="et et-${k}">${l}</span>`).join("")}</div></div>

async function enviarEmails(ids, texto, c){
  if (!mcp) return;
  const enviados = [], semEmail = [];
  for (const id of ids) {
    const to = await emailDe(id), nome = nomeDe(id);
    if (!to) { semEmail.push(nome); continue; }
    const onde = c ? `${tituloCartao(c)} (${fmtDia(c.data)})` : "a app";
    try {
      await mcp.callTool("Gmail", "send_message", { to:[to], subject:`Traços D'Amor · comentário em ${c ? tituloCartao(c) : "a app"}`,
        body:`Olá ${nome},\n\nA Tânia deixou-te um comentário em ${onde}:\n\n"${texto}"\n\nAbre a app para responder ou dar OK:\n${APP_URL}\n\nTânia Silveira` });
      enviados.push(nome);
    } catch(e){
      const m = { server_not_connected:"Liga o Gmail no claude.ai (Definições → Conectores) para enviar emails.", consent_denied:"Não deste permissão ao Gmail nesta página.", not_granted:"Não deste permissão ao Gmail nesta página." }[e?.code];
      toast(m || `O email para ${nome} não saiu. O comentário ficou na app.`); return;
    }
  }
  if (enviados.length) toast(`Email enviado a ${enviados.join(", ")}.`);
  if (semEmail.length) setTimeout(() => toast(`Sem email de ${semEmail.join(", ")}: põe-no em Estratégia → Pessoas.`), enviados.length ? 2600 : 0);
}

/* barras agrupadas: antes vs agora, Instagram ao lado do Facebook */
function kpiChart(k, T){
  const grupos = [[T.ant,"anterior"],[T.cur,"valor"]];

  const bars = grupos.map(([gl,g],gi) => REDES.map(([rk,rl,rc],ri) => { const v = k[rk]?.[g]; if (v == null) return "";

/* evolução no tempo: uma linha por rede */
function evoChart(title, pontos, key){
  const v = (p, rk) => { const x = p?.[rk]?.[key]; return x == null || x === "" ? null : Number(x); };
  const all = pontos.flatMap(p => REDES.map(([rk]) => v(p,rk))).filter(x => x != null);
  if (!all.length) return "";
  const W = 520, H = 230, pl = 30, pr = 60, pt = 20, pb = 28, max = Math.max(1, ...all), n = pontos.length;
  const X = i => pl + (n === 1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(n-1)), Y = val => H-pb - val/max*(H-pb-pt);
  const passo = Math.ceil(n/8);
  const eixo = pontos.map((p,i) => (i % passo === 0 || i === n-1) ? `<text x="${X(i)}" y="${H-8}" text-anchor="middle">${esc(p.rotulo)}</text>` : "").join("");
  const series = REDES.map(([rk,rl,rc]) => { const pts = pontos.map((p,i) => [i, v(p,rk)]).filter(([,y]) => y != null); if (!pts.length) return "";
    const last = pts[pts.length-1];
    return `<polyline class="ln ${rc}" points="${pts.map(([i,y]) => `${X(i)},${Y(y)}`).join(" ")}"/>`
      + pts.map(([i,y]) => `<g class="hit"><circle class="pt ${rc}" cx="${X(i)}" cy="${Y(y)}" r="4"/><circle cx="${X(i)}" cy="${Y(y)}" r="11" fill="transparent"/><title>${rl} · ${esc(pontos[i].rotulo)}: ${fmtN(y)}</title></g>`).join("")
      + `<text class="val" x="${X(last[0])+8}" y="${Y(last[1])+4}">${fmtN(last[1])}</text>`; }).join("");
  return `<div class="chart big"><div class="spread"><h3>${title}</h3>${legendaRedes}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}: evolução no Instagram e no Facebook"><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}"/>${series}${eixo}</svg></div>`;
}

function formatoChart(title, pf, key){

    case "ofModo": UI.of.modo = el.dataset.v; if (UI.of.modo === "dia") UI.of.semanas = UI.of.semanas.slice(0,1); renderMain(); break;
    case "ofSem": { const id = el.dataset.id; const s = UI.of.semanas;
      if (UI.of.modo === "dia") UI.of.semanas = [id]; else UI.of.semanas = s.includes(id) ? s.filter(x => x !== id) : [...s, id]; renderMain(); break; }
    case "gerar": gerar(); break;
    case "parar": genCtl?.abort(); break;
    case "descartar": UI.of.out = []; UI.of.rascId = null; renderMain(); break;
    case "eliminarUm": { const g = UI.of.out[Number(el.dataset.g)]; g.cartoes.splice(Number(el.dataset.i),1); if (!g.cartoes.length) UI.of.out.splice(Number(el.dataset.g),1); UI.of.retTxt = {}; renderMain(); break; }
    case "retificar": retificar(Number(el.dataset.g), Number(el.dataset.i)); break;
    case "enviarUm": { const g = UI.of.out[Number(el.dataset.g)]; const i = Number(el.dataset.i); if (await enviarParaQuadro(g.cartoes[i])) { g.cartoes.splice(i,1); UI.of.retTxt = {}; if (!g.cartoes.length) UI.of.out.splice(Number(el.dataset.g),1); toast("Enviado para Ideia."); renderMain(); } break; }
    case "enviarTodos": { let n = 0; for (const g of UI.of.out) for (const c of g.cartoes) if (await enviarParaQuadro(c)) n++; UI.of.out = []; toast(`${n} cartões enviados para Ideia.`); renderMain(); break; }
    case "guardarRasc": { const id = UI.of.rascId || `r-${uidShort()}`; if (await write(`data/users/${S.me.id}/${id}`, { em:new Date().toISOString(), brief:UI.of.brief, semanas:UI.of.semanas, out:UI.of.out })) { UI.of.rascId = id; toast("Guardado nos rascunhos."); } break; }
    case "abrirRasc": { const r = S.rascunhos.find(x => x.id === el.dataset.id); if (r) { UI.of.rascId = r.id; UI.of.retTxt = {}; UI.of.out = r.out || []; UI.of.brief = r.brief || ""; if (r.semanas) UI.of.semanas = r.semanas; renderMain(); } break; }
    case "apagarRasc": { try { await db.doc(`data/users/${S.me.id}/${el.dataset.id}`).delete(); } catch(x){} break; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.matches("[data-act=semSel]")) { UI.semana = t.value; renderMain(); }
  else if (t.matches("[data-act=semAbrir]")) { UI.semAberta = t.value; UI.editSem = null; t.blur(); renderMain(); }
  else if (t.matches("[data-act=sugSel]")) { UI.sugId = t.value; t.blur(); renderMain(); }
  else if (t.matches("[data-act=relSel]")) { UI.relId = t.value; t.blur(); renderMain(); }
  else if (t.matches("[data-act=dSem]")) { UI.dSem = t.value; t.blur(); renderMain(); }
  else if (t.matches("[data-act=moverSel]")) { const c = S.cartoes.find(x => x.id === UI.cardId); if (c && t.value !== c.etapa) await mover(c, t.value); }
  else if (t.matches("[data-of]")) { UI.of[t.dataset.of] = t.value; if (t.tagName === "SELECT") { t.blur(); renderMain(); } }
});
document.addEventListener("input", e => { const t = e.target; if (t.matches("[data-of]")) UI.of[t.dataset.of] = t.value; if (t.matches("[data-qa]")) UI.qaTxt = t.value; if (t.matches("[data-ret]")) { UI.of.retTxt[t.dataset.ret] = t.value; } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && UI.cardId) closeCard(); });

document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "cardForm") { const c = S.cartoes.find(x => x.id === UI.cardId); const body = papel() === "cliente" ? { legenda: new FormData(f).get("legenda") ?? c.legenda, atualizadoEm:new Date().toISOString() } : lerForm(c); if (await write(`cartoes/${c.id}`, body, true)) { localMerge(c.id, body); toast("Guardado."); renderModal(); } return; }
  if (f.id === "relForm") { const r = listaRel().find(x => x.id === UI.editRel); if (!r) return; const base = UI.relDraft?.id === r.id ? UI.relDraft : r;
    const body = { ...limpaRel(lerRelForm(base)), cliente:CLIENTE, atualizadoEm:new Date().toISOString() };
    if (await write(`${PRIV}/relatorios/${r.id}`, body)) { UI.editRel = null; UI.relDraft = null; toast(r._estado === "rascunho" ? "Rascunho guardado. Ainda não está publicado." : "Guardado. Carrega em Publicar as alterações para a cliente ver."); renderMain(); }
    return; }
  if (f.id === "resForm") {
    const c = S.cartoes.find(x => x.id === UI.cardId); const fd = new FormData(f); const num = k => { const v = fd.get(k); return v === "" || v == null ? null : Number(v); };
    const grupo = pref => Object.fromEntries(METRICAS_POST.map(([k]) => [k, num(`${pref}${k}`)]));
    const body = { atualizadoEm:new Date().toISOString(), stories:(c.stories||[]).map((s,i) => grupo(`s${i}_`)), storiesFb:(c.stories||[]).map((s,i) => grupo(`sf${i}_`)) };
    if (c.tipo === "Feed") { body.feed = grupo("f_"); body.feedFb = grupo("ff_"); body.linkPost = fd.get("linkPost") || ""; body.linkPostFb = fd.get("linkPostFb") || ""; }
    if (await write(`${PRIV}/resultados/${c.id}`, body)) toast("Resultados guardados.");
    return;
  }
  const fd = new FormData(f);
  if (f.dataset.form === "semana") {
    const cur = { ...(S.semanas.find(x => x.id === f.dataset.id) || {}) }; delete cur.id;
    ["inicio","fim","palavraChave","titulo","objetivo","oferta","estrategiaStories","estrategiaFeed"].forEach(k => { if (fd.has(k)) cur[k] = fd.get(k); });
    const n = Number(fd.get("numero")); cur.numero = n > 0 ? n : null;
    if (await write(`semanas/${f.dataset.id}`, cur)) { UI.editSem = null; toast("Guardado."); renderMain(); }
  } else if (f.dataset.form === "estrategia") {
    const cur = { ...(S.priv || {}) };
    ["objetivo","diagnostico","ritmo","tom"].forEach(k => cur[k] = fd.get(k));
    cur.regras = String(fd.get("regras")||"").split("\n").map(s => s.trim()).filter(Boolean);
    cur.metas = { ...(cur.metas||{}) }; ["cliquesLink","dms","vendasOnline","alcance"].forEach(k => { const v = fd.get("meta_"+k); cur.metas[k] = v === "" ? null : Number(v); });
    const pastas = {}; PASTAS.forEach(([k]) => { pastas[k] = fd.get("pasta_"+k) || ""; });
    const pub = { ...(S.cliente||{}), pastas };
    const ok1 = await write(PRIV, cur); const ok2 = await write(`clientes/${CLIENTE}`, pub);
    if (ok1 && ok2) { UI.editEst = false; toast("Guardado."); renderMain(); }
  }
});

/* drag & drop na vista por etapa (só a estratega) */
let dragId = null;
document.addEventListener("dragstart", e => { const t = e.target.closest(".tile[draggable]"); if (t) { dragId = t.dataset.id; e.dataTransfer.effectAllowed = "move"; } });
document.addEventListener("dragover", e => { const col = e.target.closest("[data-col]"); if (col && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("drop", async e => { const col = e.target.closest("[data-col]"); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); if (col && dragId) { e.preventDefault(); const c = S.cartoes.find(x => x.id === dragId); dragId = null; if (c && c.etapa !== col.dataset.col) await mover(c, col.dataset.col); } });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });

renderChrome(); renderMain();
</script>
